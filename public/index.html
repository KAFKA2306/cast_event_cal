<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VRChatの公開イベント、定期集会、募集締切を公式リンクと参加方法付きで探せるカレンダー">
<title>VRChat Event Calendar</title>
<style>
:root{--bg:#fbfaf7;--surface:#fff;--ink:#243653;--muted:#66758d;--line:#dfe6ef;--blue:#8fb5ec;--lav:#b9a8e6;--rose:#efb4c1;--mint:#b7dbc8;--apricot:#f3cfaa;--shadow:0 18px 50px rgba(76,91,125,.09);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:0;overflow-x:hidden;background:radial-gradient(circle at 8% 0%,rgba(143,181,236,.22),transparent 32rem),radial-gradient(circle at 95% 12%,rgba(185,168,230,.16),transparent 28rem),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select{font:inherit}a{color:inherit}.shell{width:min(1180px,100%);margin:auto;padding:28px clamp(16px,3vw,32px) 72px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:20px 0 28px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.13em;color:#58729a}h1{margin:.45rem 0 .8rem;font-size:clamp(2.25rem,7vw,5.4rem);line-height:.91;letter-spacing:-.055em;max-width:900px}.lede{max-width:780px;margin:0;color:var(--muted);font-size:clamp(.98rem,2vw,1.08rem);line-height:1.8}.hero-actions,.event-links{display:flex;gap:8px;flex-wrap:wrap}.hero-actions{justify-content:flex-end}.button,.event-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:750;overflow-wrap:anywhere}.button.primary{background:var(--ink);color:white;border-color:var(--ink)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{min-width:0;background:rgba(255,255,255,.84);border:1px solid rgba(223,230,239,.95);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.metric b{display:block;font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.04em}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}.controls{position:sticky;top:8px;z-index:10;background:rgba(251,250,247,.9);backdrop-filter:blur(16px);border:1px solid rgba(223,230,239,.9);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}.search-row{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(150px,.65fr));gap:10px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:.73rem;font-weight:800;color:var(--muted)}input[type="search"],select{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:10px 12px}.filter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;flex-wrap:wrap}.chips{display:flex;gap:7px;flex-wrap:wrap;min-width:0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--ink);cursor:pointer}.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}.toggle input{width:18px;height:18px}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 10px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}.statusbar strong{color:var(--ink)}.agenda{display:grid;gap:22px}.day{display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:start}.day-label{position:sticky;top:152px;padding:12px 4px}.day-label strong{display:block;font-size:1.03rem}.day-label span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.events{display:grid;gap:10px;min-width:0}.event{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(132px,auto);gap:16px;align-items:start;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(76,91,125,.055);min-width:0}.event:hover{border-color:var(--blue)}.time{font-weight:850;letter-spacing:-.02em}.time small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.event-main{min-width:0}.event-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;max-width:100%;padding:4px 8px;border-radius:999px;background:#eff4fb;font-size:.7rem;font-weight:800;overflow-wrap:anywhere}.badge.game{background:rgba(143,181,236,.25)}.badge.technology{background:rgba(185,168,230,.25)}.badge.hangout,.badge.language_exchange{background:rgba(183,219,200,.32)}.badge.fitness,.badge.wellness{background:rgba(243,207,170,.35)}.badge.recruitment_deadline{background:rgba(239,180,193,.33)}.event h2{font-size:1.05rem;line-height:1.45;margin:7px 0 5px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.82rem;line-height:1.55;overflow-wrap:anywhere}.description{margin:9px 0 0;color:#43536a;font-size:.88rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.detail{min-width:0;padding:8px 9px;border-radius:12px;background:#f7f8fb;color:#43536a;font-size:.75rem;line-height:1.5;overflow-wrap:anywhere}.detail b{display:block;color:var(--muted);font-size:.66rem;margin-bottom:2px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:.7rem;background:#f5f7fa;border-radius:999px;padding:4px 8px;overflow-wrap:anywhere}.event-links{align-self:center;justify-content:flex-end;max-width:210px}.event-link{font-size:.78rem;text-align:center}.event-link.primary{background:var(--ink);border-color:var(--ink);color:#fff}.empty{border:1px dashed #b9c7dc;border-radius:var(--radius);padding:52px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.65)}footer{margin-top:42px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}@media(max-width:920px){.event{grid-template-columns:76px minmax(0,1fr)}.event-links{grid-column:2;justify-content:flex-start;max-width:none}}@media(max-width:820px){.hero{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.search-row{grid-template-columns:1fr}.controls{position:static}.day{grid-template-columns:1fr;gap:8px}.day-label{position:static;padding:8px 2px 0}.details{grid-template-columns:1fr}}@media(max-width:480px){.shell{padding-inline:12px}.summary{grid-template-columns:1fr 1fr}.event{grid-template-columns:1fr;gap:8px}.event-links{grid-column:1}.time small{display:inline;margin-left:6px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div><div class="eyebrow">SOURCE-TRACEABLE · JST · AUTO UPDATE</div><h1>VRChat Event Calendar</h1><p class="lede">公開イベントと定期集会を、日時・公式リンク・参加方法・開催形式が分かる形で一覧化します。曖昧な時刻やオントロジーの曖昧一致は推測せず、監査ログへ隔離します。</p></div><div class="hero-actions"><a class="button primary" href="calendar.ics">カレンダーを購読</a><a class="button" href="events.json">JSON API</a><a class="button" href="event-ontology.json">オントロジー</a></div></section>
<section class="summary" aria-label="集計"><div class="metric"><b id="metric-total">—</b><span>表示期間のイベント</span></div><div class="metric"><b id="metric-today">—</b><span>今日・今夜</span></div><div class="metric"><b id="metric-week">—</b><span>7日以内</span></div><div class="metric"><b id="metric-sources">—</b><span>有効な情報源</span></div></section>
<section class="controls" aria-label="イベント絞り込み"><div class="search-row"><div class="field"><label for="q">検索</label><input id="q" type="search" autocomplete="off" placeholder="イベント名、主催、参加方法、開催形式、対象者"></div><div class="field"><label for="category">カテゴリ</label><select id="category"><option value="all">すべて</option><option value="game">ゲーム・謎解き</option><option value="hangout">交流・カフェ</option><option value="technology">技術・研究</option><option value="language_exchange">言語交流</option><option value="fitness">運動・ウェルネス</option><option value="performance">ライブ・公演</option><option value="recruitment_deadline">募集・締切</option></select></div><div class="field"><label for="source">情報源</label><select id="source"><option value="all">すべて</option></select></div></div><div class="filter-row"><div class="chips" aria-label="期間"><button class="chip" data-range="today" aria-pressed="false">今日</button><button class="chip" data-range="week" aria-pressed="true">7日</button><button class="chip" data-range="month" aria-pressed="false">30日</button><button class="chip" data-range="all" aria-pressed="false">120日</button></div><label class="toggle"><input id="include-deadlines" type="checkbox"> 募集・締切も通常一覧に含める</label></div></section>
<div class="statusbar"><div><strong id="result-count">0件</strong>を表示</div><div id="health">データ読込中</div></div><section id="agenda" class="agenda" aria-live="polite"></section>
<footer><span>Generated: 2026-08-02T07:50:29Z</span><span><a href="health.json">取得状態</a> · <a href="ontology-match-audit.json">照合監査</a> · <a href="https://github.com/KAFKA2306/cast_event_cal">GitHub</a></span></footer>
</main>
<script>
const state={events:[],health:null,range:'week'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=i=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(i));
const dayLabel=i=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'}).format(new Date(i));
const timeLabel=i=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(i));
const labels={game:'ゲーム',hangout:'交流',cafe:'カフェ',technology:'技術',language_exchange:'言語交流',fitness:'運動',wellness:'ウェルネス',performance:'公演',convention:'催事',world_tour:'ワールド巡り',orientation:'説明会',photo:'撮影',event:'イベント',recruitment_deadline:'募集・締切'};
function group(c){if(['game','world_tour'].includes(c))return'game';if(['hangout','cafe','orientation','photo'].includes(c))return'hangout';if(c==='technology')return'technology';if(c==='language_exchange')return'language_exchange';if(['fitness','wellness'].includes(c))return'fitness';if(['performance','convention','event'].includes(c))return'performance';return c||'other'}
function rangeEnd(r){const d=new Date();d.setDate(d.getDate()+(r==='today'?1:r==='week'?7:r==='month'?30:120));return d}
function eventLinks(e){const rows=Array.isArray(e.official_links)?e.official_links:[];const seen=new Set();const valid=[];for(const row of rows){const url=String(row?.url||'');if(!url.startsWith('https://')||seen.has(url))continue;seen.add(url);valid.push({url,label:String(row?.label||'公式リンク'),kind:String(row?.kind||'official')})}if(!valid.length&&String(e.url||'').startsWith('https://'))valid.push({url:e.url,label:'告知・参加方法',kind:'announcement'});return valid.slice(0,3)}
function filtered(){const q=$('#q').value.trim().toLowerCase(),cat=$('#category').value,src=$('#source').value,dead=$('#include-deadlines').checked,now=new Date(),end=rangeEnd(state.range);return state.events.filter(e=>{const links=eventLinks(e).map(x=>x.label).join(' ');const hay=[e.title,e.canonical_name,e.organizer,e.location,e.description,e.participation_method,e.event_format,e.audience,e.category,e.source,links,...(e.tags||[])].join(' ').toLowerCase();return new Date(e.starts_at)>=now&&new Date(e.starts_at)<=end&&hay.includes(q)&&(dead||cat==='recruitment_deadline'||e.category!=='recruitment_deadline')&&(cat==='all'||group(e.category)===cat||e.category===cat)&&(src==='all'||e.source===src)})}
function metrics(){const now=new Date(),day=rangeEnd('today'),week=rangeEnd('week'),future=state.events.filter(e=>new Date(e.starts_at)>=now);$('#metric-total').textContent=future.length;$('#metric-today').textContent=future.filter(e=>new Date(e.starts_at)<=day&&e.category!=='recruitment_deadline').length;$('#metric-week').textContent=future.filter(e=>new Date(e.starts_at)<=week&&e.category!=='recruitment_deadline').length;$('#metric-sources').textContent=state.health?.successful_sources??new Set(state.events.map(e=>e.source)).size}
function detailsHtml(e){const rows=[['参加方法',e.participation_method],['開催形式',e.event_format],['対象',e.audience]].filter(([,v])=>v);return rows.length?`<div class="details">${rows.map(([k,v])=>`<div class="detail"><b>${esc(k)}</b>${esc(v)}</div>`).join('')}</div>`:''}
function eventHtml(e){const end=e.ends_at?`–${timeLabel(e.ends_at)}`:'',tags=(e.tags||[]).slice(0,7).map(t=>`<span class="tag">${esc(t)}</span>`).join(''),links=eventLinks(e),linkHtml=links.map((l,i)=>`<a class="event-link ${i===0?'primary':''}" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.label)}</a>`).join('');return `<article class="event"><div class="time">${timeLabel(e.starts_at)}<small>${esc(end)}</small></div><div class="event-main"><div class="event-top"><span class="badge ${esc(group(e.category))}">${esc(labels[e.category]||e.category||'その他')}</span>${e.ontology_id?'<span class="badge">辞書照合済み</span>':''}</div><h2>${esc(e.canonical_name||e.title)}</h2><div class="meta">${e.organizer?`主催 ${esc(e.organizer)} · `:''}${e.location?`${esc(e.location)} · `:''}出典 ${esc(e.source)}</div>${e.description?`<p class="description">${esc(e.description)}</p>`:''}${detailsHtml(e)}${tags?`<div class="tags">${tags}</div>`:''}</div>${linkHtml?`<div class="event-links">${linkHtml}</div>`:''}</article>`}
function render(){const rows=filtered();$('#result-count').textContent=`${rows.length}件`;const groups=new Map();for(const e of rows){const k=dateKey(e.starts_at);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)}$('#agenda').innerHTML=groups.size?[...groups.values()].map(es=>`<section class="day"><div class="day-label"><strong>${dayLabel(es[0].starts_at)}</strong><span>${dateKey(es[0].starts_at)}</span></div><div class="events">${es.map(eventHtml).join('')}</div></section>`).join(''):'<div class="empty">条件に合う予定はありません。期間または絞り込み条件を変更してください。</div>'}
function sources(){const names=[...new Set(state.events.map(e=>e.source).filter(Boolean))].sort();$('#source').innerHTML='<option value="all">すべて</option>'+names.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
function setRange(r){state.range=r;document.querySelectorAll('[data-range]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.range===r)));render()}
Promise.all([fetch('events.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('events');return r.json()}),fetch('health.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('health');return r.json()})]).then(([data,health])=>{state.events=(data.events||[]).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));state.health=health;sources();metrics();const updated=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(health.generated_at));const ontology=health.ontology?` · 辞書照合 ${health.ontology.matched_events}件`:'';$('#health').textContent=`取得状態 ${health.status} · 最終更新 ${updated}${ontology}`;render()}).catch(()=>{$('#health').textContent='データを読み込めませんでした';$('#agenda').innerHTML='<div class="empty">公開データの読込に失敗しました。</div>'});
$('#q').addEventListener('input',render);$('#category').addEventListener('change',render);$('#source').addEventListener('change',render);$('#include-deadlines').addEventListener('change',render);document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click',()=>setRange(b.dataset.range)));
</script>
</body>
</html>
