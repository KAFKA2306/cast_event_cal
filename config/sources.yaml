version: 5
http:
  timeout_seconds: 25
window:
  past_days: 1
  future_days: 120
sources:
  - name: repository_manual_events
    type: manual_json
    enabled: true
    path: data/manual_events.json

  - name: vrchat_calendar_discovery
    type: manual_json
    enabled: true
    path: data/discovered_events.json

  - name: x_curated_events
    type: manual_json
    enabled: true
    path: data/x_events.json

  - name: yahoo_realtime_events
    type: manual_json
    enabled: true
    path: data/yahoo_realtime_events.json

  - name: external_calendar_events
    type: manual_json
    enabled: true
    path: data/external_events.json

# 公開ICS/JSONフィードをcoreへ直接追加する場合は以下の形式を使う。
# 利用規約・robots・再配布条件を確認し、許諾が必要な媒体は
# scripts/fetch_external_calendars.py の permissioned_ics を使用する。
# - name: community_ics
#   type: ics
#   enabled: true
#   url: https://example.com/calendar.ics
# - name: community_json
#   type: json
#   enabled: true
#   url: https://example.com/events.json
#   items_path: events
