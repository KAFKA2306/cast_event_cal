version: 1
http:
  timeout_seconds: 25
window:
  past_days: 1
  future_days: 120

dedupe_against:
  - data/manual_events.json
  - data/discovered_events.json
  - data/x_events.json
  - data/yahoo_realtime_events.json

sources:
  - name: vrc_technology_academic_hub
    type: ics
    enabled: true
    url: https://calendar.google.com/calendar/ical/fbd1334d10a177831a23dfd723199ab4d02036ae31cbc04d6fc33f08ad93a3e7%40group.calendar.google.com/public/basic.ics
    source_page: https://vrc-ta-hub.com/event/list/
    timezone: Asia/Tokyo
    max_events: 3000
    tags:
      - 技術・学術
      - 外部カレンダー

  - name: vrc_search_public_events
    type: vrc_search_pages
    enabled: true
    # VRC Search Terms allow read-only API/integration use but prohibit abusive
    # scraping/bulk export. Keep this bounded to curated public pages and
    # refresh no more than once per day; hourly production runs reuse cache.
    # Global category pages maximize breadth. Japanese category pages deepen
    # coverage past the broad Japanese page's first 20 results without adding
    # a second authority or bypassing the site's documented public surfaces.
    urls:
      - https://search.vrcwwt.com/events/music/next-month/
      - https://search.vrcwwt.com/events/dance/next-month/
      - https://search.vrcwwt.com/events/hangout/next-month/
      - https://search.vrcwwt.com/events/gaming/next-month/
      - https://search.vrcwwt.com/events/roleplaying/next-month/
      - https://search.vrcwwt.com/events/performance/next-month/
      - https://search.vrcwwt.com/events/education/next-month/
      - https://search.vrcwwt.com/events/japanese/next-week/
      - https://search.vrcwwt.com/events/english/next-week/
      - https://search.vrcwwt.com/events/spanish/next-week/
      - https://search.vrcwwt.com/ja/events/music/next-month/
      - https://search.vrcwwt.com/ja/events/dance/next-month/
      - https://search.vrcwwt.com/ja/events/hangout/next-month/
      - https://search.vrcwwt.com/ja/events/gaming/next-month/
      - https://search.vrcwwt.com/ja/events/roleplaying/next-month/
      - https://search.vrcwwt.com/fr/events/roleplaying/next-month/
      - https://search.vrcwwt.com/ja/events/education/next-month/
      - https://search.vrcwwt.com/es/events/music/next-month/
      - https://search.vrcwwt.com/de/events/music/next-month/
      - https://search.vrcwwt.com/ru/events/dance/next-month/
    source_page: https://search.vrcwwt.com/events/
    policy_url: https://search.vrcwwt.com/terms
    max_pages: 20
    max_events: 800
    refresh_hours: 24
    request_interval_seconds: 0.75
    tags:
      - VRC Search
      - 公開VRChatイベント
      - 外部ディスカバリー

  - name: official_event_websites
    type: ontology_jsonld
    enabled: true
    ontology_path: config/event_ontology.json
    allowed_link_kinds:
      - official_website
      - event_home
      - announcement
      - official_event_page
    timezone: Asia/Tokyo
    max_pages: 100
    tags:
      - 公式サイト
      - JSON-LD

  # VRCEveの利用規約は、事前許可のない継続的な自動取得と
  # 外部サービスへの組み込みを禁止している。書面等で許諾を得た後だけ、
  # Repository Secretsへ下記2値を設定して有効化する。
  - name: vrceve_authorized_feed
    type: permissioned_ics
    enabled: true
    approval_env: VRCEVE_DATA_USE_APPROVED
    url_env: VRCEVE_ICS_URL
    source_page: https://vrceve.com/
    policy_url: https://vrceve.com/policy/
    timezone: Asia/Tokyo
    max_events: 3000
    tags:
      - VRCEve
      - 許諾済みフィード
