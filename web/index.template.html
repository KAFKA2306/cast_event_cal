<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="VRChatの公開イベントを実表示データ由来のカテゴリオントロジーで分類し、公式リンクと参加方法付きで探せるカレンダー">
<link rel="icon" href="data:,">
<title>VRChat Event Calendar</title>
<style>
:root{--bg:#fbfaf7;--surface:#fff;--ink:#243653;--muted:#66758d;--line:#dfe6ef;--blue:#8fb5ec;--lav:#b9a8e6;--rose:#efb4c1;--mint:#b7dbc8;--apricot:#f3cfaa;--shadow:0 18px 50px rgba(76,91,125,.09);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:0;overflow-x:hidden;background:radial-gradient(circle at 8% 0%,rgba(143,181,236,.22),transparent 32rem),radial-gradient(circle at 95% 12%,rgba(185,168,230,.16),transparent 28rem),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Noto Sans JP",sans-serif}button,input,select{font:inherit}a{color:inherit}.shell{width:min(1180px,100%);margin:auto;padding:28px clamp(16px,3vw,32px) 72px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:20px 0 28px}.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.13em;color:#58729a}h1{margin:.45rem 0 .8rem;font-size:clamp(2.25rem,7vw,5.4rem);line-height:.91;letter-spacing:-.055em;max-width:900px}.lede{max-width:800px;margin:0;color:var(--muted);font-size:clamp(.98rem,2vw,1.08rem);line-height:1.8}.hero-actions,.event-links{display:flex;gap:8px;flex-wrap:wrap}.hero-actions{justify-content:flex-end}.button,.event-link{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-weight:750;overflow-wrap:anywhere}.button.primary{background:var(--ink);color:white;border-color:var(--ink)}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{min-width:0;background:rgba(255,255,255,.84);border:1px solid rgba(223,230,239,.95);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.metric b{display:block;font-size:clamp(1.35rem,3vw,2rem);letter-spacing:-.04em}.metric span{display:block;margin-top:3px;color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}.controls{position:sticky;top:8px;z-index:10;background:rgba(251,250,247,.9);backdrop-filter:blur(16px);border:1px solid rgba(223,230,239,.9);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}.search-row{display:grid;grid-template-columns:minmax(0,2fr) repeat(2,minmax(150px,.65fr));gap:10px}.field{display:grid;gap:6px;min-width:0}.field label{font-size:.73rem;font-weight:800;color:var(--muted)}input[type="search"],select{width:100%;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);padding:10px 12px}.filter-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:11px;flex-wrap:wrap}.chips{display:flex;gap:7px;flex-wrap:wrap;min-width:0}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:var(--ink);cursor:pointer}.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}.toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem}.toggle input{width:18px;height:18px}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 10px;color:var(--muted);font-size:.88rem;flex-wrap:wrap}.statusbar strong{color:var(--ink)}.agenda{display:grid;gap:22px}.day{display:grid;grid-template-columns:128px minmax(0,1fr);gap:18px;align-items:start}.day-label{position:sticky;top:152px;padding:12px 4px}.day-label strong{display:block;font-size:1.03rem}.day-label span{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.events{display:grid;gap:10px;min-width:0}.event{display:grid;grid-template-columns:92px minmax(0,1fr) minmax(132px,auto);gap:16px;align-items:start;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(76,91,125,.055);min-width:0}.event:hover{border-color:var(--blue)}.event.low-confidence{border-style:dashed}.event.offline{border-color:rgba(239,180,193,.8)}.time{font-weight:850;letter-spacing:-.02em}.time small{display:block;color:var(--muted);font-weight:600;margin-top:3px}.event-main{min-width:0}.event-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;max-width:100%;padding:4px 8px;border-radius:999px;background:#eff4fb;font-size:.7rem;font-weight:800;overflow-wrap:anywhere}.badge.community,.badge.language_exchange{background:rgba(183,219,200,.34)}.badge.music,.badge.performance{background:rgba(239,180,193,.3)}.badge.game,.badge.world_tour{background:rgba(143,181,236,.27)}.badge.learning,.badge.technology{background:rgba(185,168,230,.28)}.badge.art{background:rgba(239,180,193,.2)}.badge.wellness{background:rgba(243,207,170,.4)}.badge.recruitment_deadline{background:rgba(239,180,193,.4)}.badge.other{background:#eef1f5}.badge.mode{background:#f5f7fa;color:#52627a}.badge.offline{background:rgba(239,180,193,.5)}.event h2{font-size:1.05rem;line-height:1.45;margin:7px 0 5px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.82rem;line-height:1.55;overflow-wrap:anywhere}.description{margin:9px 0 0;color:#43536a;font-size:.88rem;line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.detail{min-width:0;padding:8px 9px;border-radius:12px;background:#f7f8fb;color:#43536a;font-size:.75rem;line-height:1.5;overflow-wrap:anywhere}.detail b{display:block;color:#52627a;font-size:.66rem;margin-bottom:2px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:.7rem;background:#f5f7fa;border-radius:999px;padding:4px 8px;overflow-wrap:anywhere}.event-links{align-self:center;justify-content:flex-end;max-width:210px}.event-link{font-size:.78rem;text-align:center}.event-link.primary{background:var(--ink);border-color:var(--ink);color:#fff}.empty{border:1px dashed #b9c7dc;border-radius:var(--radius);padding:52px 20px;text-align:center;color:var(--muted);background:rgba(255,255,255,.65)}footer{margin-top:42px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}@media(max-width:920px){.event{grid-template-columns:76px minmax(0,1fr)}.event-links{grid-column:2;justify-content:flex-start;max-width:none}}@media(max-width:820px){.hero{grid-template-columns:1fr}.hero-actions{justify-content:flex-start}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.search-row{grid-template-columns:1fr}.controls{position:static}.day{grid-template-columns:1fr;gap:8px}.day-label{position:static;padding:8px 2px 0}.details{grid-template-columns:1fr}}@media(max-width:480px){.shell{padding-inline:12px}.summary{grid-template-columns:1fr 1fr}.event{grid-template-columns:1fr;gap:8px}.event-links{grid-column:1}.time small{display:inline;margin-left:6px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="shell">
<section class="hero"><div><div class="eyebrow">SOURCE-TRACEABLE · JST · ONTOLOGY CLASSIFIED</div><h1>VRChat Event Calendar</h1><p class="lede">実表示データから観測した主催者・タイトル・開催形式を基に、ジャンルと開催形態を分離して分類します。曖昧な一致は確信度と根拠を保持し、監査対象として扱います。</p></div><div class="hero-actions"><a class="button primary" href="calendar.ics">カレンダーを購読</a><a class="button" href="events.json">JSON API</a><a class="button" href="event-ontology.json">観測オントロジー</a><a class="button" href="category-ontology.json">カテゴリ定義</a></div></section>
<section class="summary" aria-label="集計"><div class="metric"><b id="metric-total">—</b><span>今後のイベント</span></div><div class="metric"><b id="metric-today">—</b><span>今日・今夜</span></div><div class="metric"><b id="metric-week">—</b><span>7日以内</span></div><div class="metric"><b id="metric-sources">—</b><span>有効な情報源</span></div></section>
<section class="controls" aria-label="イベント絞り込み"><div class="search-row"><div class="field"><label for="q">検索</label><input id="q" type="search" autocomplete="off" placeholder="イベント名、主催、カテゴリ、参加方法、開催形式、分類根拠"></div><div class="field"><label for="category">カテゴリ</label><select id="category"><option value="all">すべて</option></select></div><div class="field"><label for="source">情報源</label><select id="source"><option value="all">すべて</option></select></div></div><div class="filter-row"><div class="chips" role="group" aria-label="期間"><button class="chip" data-range="today" aria-pressed="false">今日</button><button class="chip" data-range="week" aria-pressed="true">7日</button><button class="chip" data-range="month" aria-pressed="false">30日</button><button class="chip" data-range="all" aria-pressed="false">120日</button></div><label class="toggle"><input id="include-deadlines" type="checkbox"> 募集・締切も通常一覧に含める</label></div></section>
<div class="statusbar"><div><strong id="result-count">0件</strong>を表示</div><div id="health">データ読込中</div></div><div id="agenda" class="agenda" aria-live="polite"></div>
<footer><span>Generated: {{GENERATED_AT}}</span><span><a href="health.json">取得状態</a> · <a href="ontology-match-audit.json">分類・照合監査</a> · <a href="https://github.com/KAFKA2306/cast_event_cal">GitHub</a></span></footer>
</main>
<script>
const fallbackCategories=[
  {id:'community',label:'交流・カフェ'},
  {id:'music',label:'音楽・ダンス'},
  {id:'performance',label:'公演・ショー'},
  {id:'game',label:'ゲーム・参加型'},
  {id:'learning',label:'学習・講義'},
  {id:'technology',label:'技術・研究'},
  {id:'language_exchange',label:'言語交流'},
  {id:'art',label:'アート・展示・撮影'},
  {id:'world_tour',label:'ワールド巡り・観光'},
  {id:'wellness',label:'運動・ウェルネス'},
  {id:'recruitment_deadline',label:'募集・締切'},
  {id:'other',label:'その他'}
];
const state={events:[],health:null,range:'week',categories:fallbackCategories};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=i=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(i));
const dayLabel=i=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'}).format(new Date(i));
const timeLabel=i=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(i));
const legacyCategory={hangout:'community',cafe:'community',orientation:'learning',photo:'art',fitness:'wellness',convention:'performance',event:'other'};
const modeLabels={in_world:'VRChat内',stream:'配信',hybrid:'ハイブリッド',offline:'オフライン',deadline:'締切',unknown:'形態不明'};
const detailLabels={cafe:'カフェ',bar:'バー',social:'交流',hangout:'雑談',cast_service:'接客',dj:'DJ',live_music:'ライブ音楽',dance:'ダンス',theater:'演劇',reading:'朗読',comedy:'お笑い',show:'ショー',mystery:'謎解き',quiz:'クイズ',tabletop:'卓上ゲーム',competition:'競技',auction:'オークション',lecture:'講義',class:'教室',workshop:'勉強会',orientation:'説明会',research:'研究',engineering:'技術',ai:'AI',language_exchange:'言語交流',conversation_practice:'会話練習',exhibition:'展示',photography:'撮影',world_tour:'ワールド巡り',sightseeing:'観光',fitness:'運動',yoga:'ヨガ',relaxation:'リラックス',cast_recruitment:'キャスト募集',staff_recruitment:'スタッフ募集',participant_recruitment:'参加者募集',application_deadline:'応募締切'};
function categoryKey(value){return legacyCategory[value]||value||'other'}
function categoryLabel(event){const key=categoryKey(event.category);return event.category_label||state.categories.find(row=>row.id===key)?.label||key}
function rangeEnd(range){const date=new Date();date.setDate(date.getDate()+(range==='today'?1:range==='week'?7:range==='month'?30:120));return date}
function eventLinks(event){const rows=Array.isArray(event.official_links)?event.official_links:[];const seen=new Set();const valid=[];for(const row of rows){const url=String(row?.url||'');if(!url.startsWith('https://')||seen.has(url))continue;seen.add(url);valid.push({url,label:String(row?.label||'公式リンク'),kind:String(row?.kind||'official')})}if(!valid.length&&String(event.url||'').startsWith('https://'))valid.push({url:event.url,label:'告知・参加方法',kind:'announcement'});return valid.slice(0,3)}
function filtered(){const query=$('#q').value.trim().toLowerCase(),category=$('#category').value,source=$('#source').value,includeDeadlines=$('#include-deadlines').checked,now=new Date(),end=rangeEnd(state.range);return state.events.filter(event=>{const key=categoryKey(event.category),links=eventLinks(event).map(row=>row.label).join(' ');const haystack=[event.title,event.canonical_name,event.organizer,event.location,event.description,event.participation_method,event.event_format,event.audience,event.category,event.category_label,event.category_detail,event.event_mode,event.category_source,...(event.category_evidence||[]),event.source,links,...(event.tags||[])].join(' ').toLowerCase();return new Date(event.starts_at)>=now&&new Date(event.starts_at)<=end&&haystack.includes(query)&&(includeDeadlines||category==='recruitment_deadline'||key!=='recruitment_deadline')&&(category==='all'||key===category)&&(source==='all'||event.source===source)})}
function metrics(){const now=new Date(),day=rangeEnd('today'),week=rangeEnd('week'),future=state.events.filter(event=>new Date(event.starts_at)>=now);$('#metric-total').textContent=future.length;$('#metric-today').textContent=future.filter(event=>new Date(event.starts_at)<=day&&categoryKey(event.category)!=='recruitment_deadline').length;$('#metric-week').textContent=future.filter(event=>new Date(event.starts_at)<=week&&categoryKey(event.category)!=='recruitment_deadline').length;$('#metric-sources').textContent=state.health?.successful_sources??new Set(state.events.map(event=>event.source)).size}
function detailsHtml(event){const evidence=(event.category_evidence||[]).slice(0,2).map(value=>String(value).replace(/^keyword:[^:]+:/,'')).join(' / ');const rows=[['参加方法',event.participation_method],['開催形式',event.event_format],['対象',event.audience],['分類根拠',evidence]].filter(([,value])=>value);return rows.length?`<div class="details">${rows.map(([key,value])=>`<div class="detail"><b>${esc(key)}</b>${esc(value)}</div>`).join('')}</div>`:''}
function eventHtml(event){const category=categoryKey(event.category),end=event.ends_at?`–${timeLabel(event.ends_at)}`:'',tags=(event.tags||[]).slice(0,7).map(tag=>`<span class="tag">${esc(tag)}</span>`).join(''),links=eventLinks(event),linkHtml=links.map((link,index)=>`<a class="event-link ${index===0?'primary':''}" href="${esc(link.url)}" target="_blank" rel="noopener noreferrer">${esc(link.label)}</a>`).join(''),detail=event.category_detail?detailLabels[event.category_detail]||event.category_detail:null,mode=modeLabels[event.event_mode]||event.event_mode,confidence=Number(event.category_confidence);const classes=['event',confidence&&confidence<.6?'low-confidence':'',event.event_mode==='offline'?'offline':''].filter(Boolean).join(' ');return `<article class="${classes}"><div class="time">${timeLabel(event.starts_at)}<small>${esc(end)}</small></div><div class="event-main"><div class="event-top"><span class="badge ${esc(category)}">${esc(categoryLabel(event))}</span>${detail?`<span class="badge">${esc(detail)}</span>`:''}${mode?`<span class="badge mode ${event.event_mode==='offline'?'offline':''}">${esc(mode)}</span>`:''}${event.ontology_id?'<span class="badge">辞書照合済み</span>':''}${confidence?`<span class="badge mode">分類 ${Math.round(confidence*100)}%</span>`:''}</div><h2>${esc(event.canonical_name||event.title)}</h2><div class="meta">${event.organizer?`主催 ${esc(event.organizer)} · `:''}${event.location?`${esc(event.location)} · `:''}出典 ${esc(event.source)}</div>${event.description?`<p class="description">${esc(event.description)}</p>`:''}${detailsHtml(event)}${tags?`<div class="tags">${tags}</div>`:''}</div>${linkHtml?`<div class="event-links">${linkHtml}</div>`:''}</article>`}
function render(){const rows=filtered();$('#result-count').textContent=`${rows.length}件`;const groups=new Map();for(const event of rows){const key=dateKey(event.starts_at);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(event)}$('#agenda').innerHTML=groups.size?[...groups.values()].map(events=>`<section class="day"><div class="day-label"><strong>${dayLabel(events[0].starts_at)}</strong><span>${dateKey(events[0].starts_at)}</span></div><div class="events">${events.map(eventHtml).join('')}</div></section>`).join(''):'<div class="empty">条件に合う予定はありません。期間または絞り込み条件を変更してください。</div>'}
function buildSources(){const names=[...new Set(state.events.map(event=>event.source).filter(Boolean))].sort();$('#source').innerHTML='<option value="all">すべて</option>'+names.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('')}
function buildCategories(){const rows=state.categories.filter(row=>row.id&&row.id!=='other').concat(state.categories.filter(row=>row.id==='other'));$('#category').innerHTML='<option value="all">すべて</option>'+rows.map(row=>`<option value="${esc(row.id)}">${esc(row.label||row.id)}</option>`).join('')}
function setRange(range){state.range=range;document.querySelectorAll('[data-range]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.range===range)));render()}
const categoryRequest=fetch('category-ontology.json',{cache:'no-store'}).then(response=>response.ok?response.json():null).catch(()=>null);
Promise.all([fetch('events.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('events');return response.json()}),fetch('health.json',{cache:'no-store'}).then(response=>{if(!response.ok)throw Error('health');return response.json()}),categoryRequest]).then(([data,health,categoryOntology])=>{state.events=(data.events||[]).sort((left,right)=>new Date(left.starts_at)-new Date(right.starts_at));state.health=health;if(Array.isArray(categoryOntology?.categories))state.categories=categoryOntology.categories.map(row=>({id:String(row.id||''),label:String(row.label||row.id||'')})).filter(row=>row.id);buildCategories();buildSources();metrics();const updated=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(health.generated_at));const ontology=health.ontology?` · 辞書照合 ${health.ontology.matched_events}件`:'';const classification=health.category_classification?` · 要確認 ${health.category_classification.audit_event_count}件`:'';$('#health').textContent=`取得状態 ${health.status} · 最終更新 ${updated}${ontology}${classification}`;render()}).catch(()=>{$('#health').textContent='データを読み込めませんでした';$('#agenda').innerHTML='<div class="empty">公開データの読込に失敗しました。</div>'});
$('#q').addEventListener('input',render);$('#category').addEventListener('change',render);$('#source').addEventListener('change',render);$('#include-deadlines').addEventListener('change',render);document.querySelectorAll('[data-range]').forEach(button=>button.addEventListener('click',()=>setRange(button.dataset.range)));
</script>
</body>
</html>
