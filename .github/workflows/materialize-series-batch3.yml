name: Materialize verified event series batch 3

on:
  push:
    branches:
      - agent/expand-series-links-3
    paths:
      - .github/workflows/materialize-series-batch3.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Capture exact baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          baseline = {
              'event_count': audit['event_count'],
              'ontology_entries': audit['ontology_entries'],
              'matched_events': audit['matched_events'],
              'unmatched_events': audit['unmatched_events'],
              'ambiguous_events': audit['ambiguous_events'],
              'matched_series_count': len(audit['matched_series']),
              'category_breakdown': health['category_classification']['category_breakdown'],
              'subcategory_breakdown': health['category_classification']['subcategory_breakdown'],
              'event_mode_breakdown': health['category_classification']['event_mode_breakdown'],
          }
          assert baseline['ambiguous_events'] == 0
          Path('/tmp/series-batch3-baseline.json').write_text(
              json.dumps(baseline, ensure_ascii=False, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(baseline, ensure_ascii=False))
          PY
      - name: Materialize verified entries
        run: python scripts/materialize_series_batch3.py
      - name: Run full regression suite
        run: pytest -q
      - name: Regenerate public ontology data
        run: |
          python -m cast_event_cal.ontology
          PYTHONPATH=. python scripts/build_observed_ontology.py
          git show origin/main:public/yahoo-rejection-sample-audit.json > public/yahoo-rejection-sample-audit.json
      - name: Validate exact delta and classification stability
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/series-batch3-baseline.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('config/event_ontology.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          profiles = [row for row in events['events'] if row.get('series_profile')]
          expected_series = {'vrc-idle-gathering': 17, 'vrc-petting-zoo': 17}

          assert events['count'] == before['event_count']
          assert audit['event_count'] == before['event_count']
          assert len(ontology['entries']) == before['ontology_entries'] + 2
          assert audit['ontology_entries'] == before['ontology_entries'] + 2
          assert audit['matched_events'] == before['matched_events'] + 34
          assert audit['unmatched_events'] == before['unmatched_events'] - 34
          assert audit['ambiguous_events'] == before['ambiguous_events'] == 0
          assert len(audit['matched_series']) == before['matched_series_count'] + 2
          assert all(audit['matched_series'].get(key) == count for key, count in expected_series.items())
          assert health['ontology']['entries'] == audit['ontology_entries']
          assert health['ontology']['matched_events'] == audit['matched_events']
          assert health['ontology']['matched_series'] == len(audit['matched_series'])
          assert health['ontology']['unmatched_events'] == audit['unmatched_events']
          assert health['ontology']['ambiguous_events'] == 0
          assert len(profiles) == audit['matched_events']
          assert all(
              row.get('series_profile', {}).get('curation', {}).get('status') == 'human_curated'
              for row in profiles
          )
          assert health['category_classification']['category_breakdown'] == before['category_breakdown']
          assert health['category_classification']['subcategory_breakdown'] == before['subcategory_breakdown']
          assert health['category_classification']['event_mode_breakdown'] == before['event_mode_breakdown']
          print(json.dumps({
              'event_count': audit['event_count'],
              'ontology_entries': audit['ontology_entries'],
              'matched_events': audit['matched_events'],
              'unmatched_events': audit['unmatched_events'],
              'ambiguous_events': audit['ambiguous_events'],
              'new_series': expected_series,
          }, ensure_ascii=False))
          PY
      - name: Remove audit and implementation artifacts
        run: |
          rm -rf cast_event_cal.egg-info
          rm -f series-batch3-audit.json
          rm -f .github/workflows/audit-series-batch3.yml
          rm -f .github/workflows/materialize-series-batch3.yml
          rm -f scripts/materialize_series_batch3.py
          git diff --check
      - name: Commit verified batch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Expand verified event series linking batch 3'
          git pull --rebase origin agent/expand-series-links-3
          git push origin HEAD:agent/expand-series-links-3
