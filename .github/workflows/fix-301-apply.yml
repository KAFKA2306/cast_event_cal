name: Apply recurrence boundary safety fix

on:
  push:
    branches: [fix/301-recurrence-clause-boundary]
    paths: [.github/workflows/fix-301-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/301-recurrence-clause-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared recurrence clause boundary gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/relative_datetime.py')
          s = p.read_text()
          needle = '\n\ndef _recurrence_clause_has_event_identity(text: str, match: re.Match[str]) -> bool:\n'
          helper = '''\n\ndef _recurrence_match_stays_in_clause(match: re.Match[str]) -> bool:\n    """Reject a recurrence regex match that consumed a later recurrence clause."""\n    return sum(1 for _ in RECURRENCE_MARKER_RE.finditer(match.group(0))) <= 1\n'''
          assert needle in s
          s = s.replace(needle, helper + needle, 1)
          old = 'if match and _recurrence_clause_has_event_identity(normalized, match):'
          new = ('if (\n'
                 '        match\n'
                 '        and _recurrence_match_stays_in_clause(match)\n'
                 '        and _recurrence_clause_has_event_identity(normalized, match)\n'
                 '    ):')
          count = s.count(old)
          assert count == 7, count
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Run focused regression and lint
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q tests/test_recurrence_clause_boundary.py
          python -m ruff check scripts/relative_datetime.py tests/test_recurrence_clause_boundary.py
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-301-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/relative_datetime.py .github/workflows/fix-301-apply.yml
          git commit -m 'fix: keep recurrence clock inside its clause'
          git push
