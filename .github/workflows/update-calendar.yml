name: Update calendar and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - cast_event_cal/**
      - config/**
      - data/recurring_events.json
      - data/one_off_events.json
      - scripts/materialize_events.py
      - scripts/fetch_vrchat_calendar.py
      - main_executor.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/update-calendar.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Materialize curated recurring events
        run: python scripts/materialize_events.py

      - name: Discover public VRChat calendar events
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python scripts/fetch_vrchat_calendar.py

      - name: Build calendar
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python main_executor.py run --strict

      - name: Validate generated assets and coverage
        run: |
          set -euo pipefail
          grep -q 'VRChat Event Calendar' public/index.html
          grep -q 'BEGIN:VCALENDAR' public/calendar.ics
          python - <<'PY'
          import json
          from pathlib import Path

          manual = json.loads(Path('data/manual_events.json').read_text(encoding='utf-8'))
          discovered = json.loads(Path('data/discovered_events.json').read_text(encoding='utf-8'))
          discovery_health = json.loads(Path('data/discovery_health.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          assert len(manual) >= 60, f'curated event coverage too small: {len(manual)}'
          assert len({item['source_id'] for item in manual}) == len(manual)
          assert len({item['source_id'] for item in discovered}) == len(discovered)
          assert discovery_health.get('status') in {'ok', 'degraded', 'skipped'}
          assert discovery_health.get('event_count') == len(discovered)
          assert isinstance(events.get('events'), list)
          assert events.get('count') == len(events['events'])
          assert events.get('count') >= 60, f"event coverage too small: {events.get('count')}"
          assert health.get('status') in {'ok', 'degraded'}
          assert health.get('event_count') == events.get('count')
          assert health.get('enabled_sources', 0) >= 2
          assert {item.get('name') for item in health.get('sources', [])} >= {
              'repository_manual_events',
              'vrchat_calendar_discovery',
          }
          PY

      - name: Commit generated data
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/manual_events.json data/discovered_events.json data/discovery_health.json public)" ]; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manual_events.json data/discovered_events.json data/discovery_health.json public
          git commit -m 'chore: refresh calendar [skip ci]'
          git push

      - name: Detect Pages bootstrap token
        id: pages_token
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          if [ -n "$PAGES_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Configure existing GitHub Pages
        id: configure_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Enable GitHub Pages when needed
        if: steps.configure_pages.outcome == 'failure' && steps.pages_token.outputs.available == 'true'
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_TOKEN }}
          enablement: true

      - name: Stop when Pages cannot be enabled
        if: steps.configure_pages.outcome == 'failure' && steps.pages_token.outputs.available != 'true'
        run: |
          echo '::error::Enable Settings > Pages > Source: GitHub Actions, or add PAGES_TOKEN with Pages and repository administration permissions.'
          exit 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify public Pages endpoints
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          root_status=000
          events_status=000
          verified=false
          for attempt in $(seq 1 30); do
            root_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-index.html -w '%{http_code}' "$base/" || true)"
            events_status="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/live-events.json -w '%{http_code}' "$base/events.json" || true)"
            if [ "$root_status" = '200' ] && [ "$events_status" = '200' ] \
              && grep -q 'VRChat Event Calendar' /tmp/live-index.html \
              && python -c 'import json; data=json.load(open("/tmp/live-events.json", encoding="utf-8")); assert isinstance(data.get("events"), list) and data.get("count", 0) >= 60'; then
              verified=true
              break
            fi
            sleep 10
          done
          if [ "$verified" != 'true' ]; then
            echo "Public Pages verification failed: root=$root_status events=$events_status" >&2
            exit 1
          fi
          mkdir -p audit
          export ROOT_STATUS="$root_status" EVENTS_STATUS="$events_status"
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          live = json.loads(Path('/tmp/live-events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          result = {
              'schema_version': '2.0',
              'verified_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'page_url': os.environ['PAGE_URL'],
              'root_status': int(os.environ['ROOT_STATUS']),
              'events_status': int(os.environ['EVENTS_STATUS']),
              'event_count': len(live.get('events', [])),
              'minimum_event_count': 60,
              'enabled_sources': health.get('enabled_sources'),
              'sources': health.get('sources', []),
              'source_commit': os.environ['GITHUB_SHA'],
              'status': 'ok',
          }
          Path('audit/production-status.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Record production verification
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/production-status.json
          if git diff --cached --quiet; then
            echo 'No audit changes'
            exit 0
          fi
          git commit -m 'chore: record production verification [skip ci]'
          git pull --rebase origin main
          git push
