name: Cleanup Pages refresh branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-pages-refresh-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete completed branches and workflow
        run: |
          set -euo pipefail
          git push origin --delete agent/refresh-pages-20260803 || true
          git push origin --delete agent/refresh-pages-20260803-temp || true
          rm .github/workflows/cleanup-pages-refresh-branches.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cleanup-pages-refresh-branches.yml
          git commit -m 'chore: remove completed Pages refresh cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
