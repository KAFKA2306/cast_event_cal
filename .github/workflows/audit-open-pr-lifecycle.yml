name: Audit open PR lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-open-pr-lifecycle.yml'
      - 'scripts/audit_open_pr_lifecycle.py'
      - 'tests/test_open_pr_lifecycle_audit.py'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Focused regression
        run: pytest -q tests/test_open_pr_lifecycle_audit.py
      - name: Build read-only lifecycle report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_open_pr_lifecycle.py --output open-pr-lifecycle.json
      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0 (official tag)
        with:
          name: open-pr-lifecycle-${{ github.run_id }}
          path: open-pr-lifecycle.json
          if-no-files-found: error
          retention-days: 30
