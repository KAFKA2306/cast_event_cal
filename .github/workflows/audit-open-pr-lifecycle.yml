name: Audit open PR lifecycle

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Focused regression
        run: pytest -q tests/test_open_pr_lifecycle_audit.py
      - name: Build read-only lifecycle report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_open_pr_lifecycle.py --output open-pr-lifecycle.json
      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: open-pr-lifecycle-${{ github.run_id }}
          path: open-pr-lifecycle.json
          if-no-files-found: error
          retention-days: 30
