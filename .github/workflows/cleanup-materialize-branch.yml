name: Cleanup materialize branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-materialize-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged branch
        run: git push origin --delete ops/materialize-history-ontology
      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-materialize-branch.yml
          git commit -m 'chore: remove materialize branch cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
