name: Remove all completed work branches

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-all-work-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete every non-main branch and this workflow
        run: |
          set -euo pipefail
          for branch in \
            agent/fix-relative-weekday-resolution \
            agent/fix-relative-weekday-resolution-v2 \
            feat/yahoo-v19-recovery-observable \
            ops/trigger-yahoo-v19
          do
            git push origin --delete "$branch" || true
          done
          rm .github/workflows/cleanup-all-work-branches.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cleanup-all-work-branches.yml
          git commit -m 'chore: remove completed branch cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
