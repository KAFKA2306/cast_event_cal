name: One-time canonical URL migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-canonical-url.yml

permissions:
  contents: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Replace canonical repository URL in generation sources
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://kafka2306.github.io/vrc_cast_event_calender'
          new = 'https://kafka2306.github.io/cast_event_cal'
          paths = [
              Path('web/index.template.html'),
              Path('scripts/render_search_pages.py'),
          ]
          counts = {}
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'expected old canonical URL in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              counts[str(path)] = count
          print(counts)
          PY
      - name: Render public surface from canonical sources
        run: |
          python scripts/render_frontend.py
          python scripts/render_search_pages.py
          python scripts/render_category_pages.py
          python scripts/render_series_pages.py
          python scripts/render_social_assets.py
          python scripts/render_internal_links.py
          python scripts/verify_crawl_graph.py
      - name: Run targeted tests
        run: |
          pytest \
            tests/test_search_pages.py \
            tests/test_category_pages.py \
            tests/test_series_pages.py \
            tests/test_social_assets.py \
            tests/test_crawl_graph.py \
            tests/test_web_template_quality_contract.py \
            -q
      - name: Verify canonical URL migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          old = 'https://kafka2306.github.io/vrc_cast_event_calender'
          new = 'https://kafka2306.github.io/cast_event_cal'
          index = Path('public/index.html').read_text(encoding='utf-8')
          assert f'<link rel="canonical" href="{new}/">' in index
          assert f'<meta property="og:url" content="{new}/">' in index
          assert old not in index

          root = ET.parse('public/sitemap.xml').getroot()
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [node.text for node in root.findall('s:url/s:loc', ns)]
          assert urls and urls[0] == new + '/'
          assert all(url and url.startswith(new + '/') for url in urls)
          assert all(old not in url for url in urls if url)

          for root_dir in ('scripts', 'web', 'tests'):
              for path in Path(root_dir).rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.html', '.js', '.css', '.json', '.xml'}:
                      assert old not in path.read_text(encoding='utf-8', errors='ignore'), path
          print({'sitemap_urls': len(urls), 'canonical': new + '/'})
          PY
      - name: Commit canonical source and generated surface
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -rf cast_event_cal.egg-info
          git add web/index.template.html scripts/render_search_pages.py public
          git diff --cached --check -- web/index.template.html scripts/render_search_pages.py
          git commit -m 'fix: move canonical public URL to cast_event_cal'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
