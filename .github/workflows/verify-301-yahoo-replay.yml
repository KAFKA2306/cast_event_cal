name: Verify #301 Yahoo replay
on:
  push:
    branches: [fix/301-recurrence-clause-boundary]
permissions:
  contents: write
  issues: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/301-recurrence-clause-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Yahoo archive zero-loss replay
        run: |
          python - <<'PY' | tee /tmp/replay.log
          from datetime import UTC, datetime
          from scripts import collect_yahoo_corpus as corpus
          from scripts import fetch_yahoo_realtime as implementation
          from scripts import reclassify_yahoo_archive as archive
          from scripts import run_yahoo_realtime as ledger
          history_payload = corpus.read_json(ledger.HISTORY_PATH, {})
          history = [row for row in history_payload.get('candidates', []) if isinstance(row, dict)]
          health = ledger.read_object(implementation.HEALTH_PATH)
          actual_now = implementation.parse_instant(str(health.get('generated_at') or '')) or datetime.now(UTC)
          before = implementation.read_array(implementation.OUTPUT_PATH)
          x_ids = implementation.known_x_ids(implementation.read_array(implementation.X_EVENTS_PATH))
          archive.configure_archive_classifier()
          accepted, _, evaluated = archive.reclassify(history, actual_now=actual_now, x_ids=x_ids, external_events=implementation.read_array(archive.EXTERNAL_EVENTS_PATH))
          def origin_status_id(row):
              explicit = str(row.get('source_status_id') or '')
              if implementation.STATUS_ID_RE.fullmatch(explicit): return explicit
              source_id = str(row.get('recurrence_source_id') or row.get('source_id') or '')
              match = implementation.STATUS_ID_RE.search(source_id)
              return match.group(0) if match else ''
          def by_origin(rows):
              grouped = {}
              for row in rows:
                  status_id = origin_status_id(row)
                  if status_id: grouped.setdefault(status_id, []).append(row)
              return grouped
          before_ids = set(by_origin(before))
          after_ids = set(by_origin(accepted))
          lost = sorted(before_ids - after_ids)
          promoted = sorted(after_ids - before_ids)
          provenance_gaps = [sid for sid in promoted if not any(origin_status_id(row) == sid for row in accepted)]
          print(f'Yahoo replay history={len(history)} before={len(before_ids)} after={len(after_ids)} lost_existing={len(lost)} promoted={len(promoted)} provenance_gaps={len(provenance_gaps)} evaluated={len(evaluated)}')
          if lost: raise SystemExit(f'lost existing accepted sources: {lost[:10]}')
          if provenance_gaps: raise SystemExit(f'provenance gaps: {provenance_gaps[:10]}')
          if len(evaluated) != len(history): raise SystemExit('replay did not evaluate full ledger')
          PY
      - name: Record result and remove verifier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 301 --body "Verification on PR #302 head before verifier cleanup: $(cat /tmp/replay.log). Focused recurrence regression, full pytest, and Ruff already passed in the preceding one-shot patch run. No merge/release/publication performed."
          rm .github/workflows/verify-301-yahoo-replay.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/verify-301-yahoo-replay.yml
          git commit -m 'chore: remove #301 replay verifier'
          git push