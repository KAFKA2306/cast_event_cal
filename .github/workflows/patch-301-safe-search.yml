name: Patch #301 safe recurrence search
on:
  push:
    branches: [fix/301-recurrence-clause-boundary]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/301-recurrence-clause-boundary
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch parser
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/relative_datetime.py')
          s = p.read_text()
          helper = '''\n\ndef _safe_recurrence_search(pattern: re.Pattern[str], text: str) -> re.Match[str] | None:\n    \"\"\"Return the first recurrence match that does not consume a later clause.\"\"\"\n    start = 0\n    while match := pattern.search(text, start):\n        markers = list(RECURRENCE_MARKER_RE.finditer(match.group(0)))\n        if len(markers) <= 1:\n            return match\n        # Resume at the later recurrence marker inside the rejected match.\n        # Using match.end() would skip the valid later clause entirely.\n        start = match.start() + markers[1].start()\n    return None\n'''
          anchor = '\n\ndef _recurrence_match_stays_in_clause(match: re.Match[str]) -> bool:'
          if '_safe_recurrence_search(' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          patterns = [
              'DAILY_RECURRENCE_PATTERN', 'MULTI_WEEKLY_RECURRENCE_PATTERN',
              'WEEKLY_RECURRENCE_PATTERN', 'MULTI_MONTHLY_DAY_RECURRENCE_PATTERN',
              'MONTHLY_DAY_RECURRENCE_PATTERN', 'LAST_WEEKDAY_MONTHLY_RECURRENCE_PATTERN',
              'ORDINAL_MONTHLY_RECURRENCE_PATTERN',
          ]
          for name in patterns:
              old = f'match = {name}.search(normalized)'
              new = f'match = _safe_recurrence_search({name}, normalized)'
              if old not in s and new not in s:
                  raise SystemExit(f'missing expected search: {name}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Focused regression
        run: python -m pytest -q tests/test_recurrence_clause_boundary.py
      - name: Lint
        run: python -m ruff check scripts/relative_datetime.py tests/test_recurrence_clause_boundary.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/relative_datetime.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: continue recurrence search after clause rejection'
          git push
