name: Main validation provenance

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read exact-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          printf '%s' '${{ toJson(github.event.workflow_run) }}' > /tmp/run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > /tmp/jobs.json
      - name: Build fail-closed validation record
        run: >-
          python scripts/build_validation_provenance.py
          --commit-sha '${{ github.event.workflow_run.head_sha }}'
          --run-json /tmp/run.json
          --jobs-json /tmp/jobs.json
          --output main-validation-provenance.json
      - name: Upload durable run artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-validation-provenance-${{ github.event.workflow_run.head_sha }}-attempt-${{ github.event.workflow_run.run_attempt }}
          path: main-validation-provenance.json
          if-no-files-found: error
          retention-days: 90
