name: Fix Yahoo refiner lint once

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-ruff-refiner-pr.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove unused import and workflow
        run: |
          set -euo pipefail
          sed -i '/^import json$/d' scripts/refine_yahoo_corpus.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/refine_yahoo_corpus.py
          git rm .github/workflows/fix-ruff-refiner-pr.yml
          git commit -m 'style: remove unused Yahoo refiner import [skip ci]'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
