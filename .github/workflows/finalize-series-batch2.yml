name: Finalize verified event series batch 2

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/expand-series-links-2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Correct fitness category
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/event_ontology.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          entry = next(item for item in payload['entries'] if item['canonical_id'] == 'vrc-fit-boxing')
          entry['category'] = 'wellness'
          entry['subcategory'] = 'fitness'
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Run regression tests
        run: pytest -q
      - name: Regenerate public ontology data
        run: |
          python -m cast_event_cal.ontology
          PYTHONPATH=. python scripts/build_observed_ontology.py
          git show origin/main:public/yahoo-rejection-sample-audit.json > public/yahoo-rejection-sample-audit.json
      - name: Validate exact outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ontology = json.loads(Path('config/event_ontology.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          fit = next(item for item in ontology['entries'] if item['canonical_id'] == 'vrc-fit-boxing')
          expected = {
              'exploit-club': 18,
              'vrc-game-world-club': 18,
              'ml-gathering': 17,
              'personally-match': 17,
              'vrc-beginner-world-tour': 17,
              'vrc-fit-boxing': 34,
          }

          assert events['count'] == 595
          assert len(ontology['entries']) == 13
          assert fit['category'] == 'wellness'
          assert fit['subcategory'] == 'fitness'
          assert audit['ontology_entries'] == 13
          assert audit['matched_events'] == 242
          assert audit['unmatched_events'] == 353
          assert audit['ambiguous_events'] == 0
          assert all(audit['matched_series'].get(key) == count for key, count in expected.items())
          assert health['ontology']['entries'] == 13
          assert health['ontology']['matched_events'] == 242
          assert health['ontology']['unmatched_events'] == 353
          assert health['ontology']['ambiguous_events'] == 0
          assert health['category_classification']['category_breakdown']['community'] == 151
          assert health['category_classification']['category_breakdown']['wellness'] == 51
          print(json.dumps({
              'event_count': events['count'],
              'ontology_entries': audit['ontology_entries'],
              'matched_events': audit['matched_events'],
              'unmatched_events': audit['unmatched_events'],
              'ambiguous_events': audit['ambiguous_events'],
              'new_series': expected,
          }, ensure_ascii=False))
          PY
      - name: Remove generated and one-time files
        run: |
          rm -rf cast_event_cal.egg-info
          rm -f .github/workflows/finalize-series-batch2.yml
          git diff --check
      - name: Commit finalized batch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Finalize verified event series linking batch 2'
          git pull --rebase origin "$GITHUB_HEAD_REF"
          git push origin HEAD:"$GITHUB_HEAD_REF"
