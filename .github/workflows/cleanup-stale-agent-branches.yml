name: Cleanup stale agent branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-stale-agent-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete superseded branches
        run: |
          set -euo pipefail
          git push origin --delete \
            agent/add-live-calendar-discovery \
            agent/expand-event-coverage \
            agent/finalize-automation \
            agent/refresh-automation
      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-stale-agent-branches.yml
          git commit -m 'chore: remove stale branch cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
