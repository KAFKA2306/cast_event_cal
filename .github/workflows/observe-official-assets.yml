name: Observe official asset enrichment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/observe-official-assets.yml

permissions:
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run observable pipeline
        shell: bash
        run: |
          set +e
          mkdir -p audit
          : > audit/official-assets-observation.txt
          pytest -q tests/test_official_asset_enrichment.py >> audit/official-assets-observation.txt 2>&1
          echo "TEST_EXIT=$?" >> audit/official-assets-observation.txt
          timeout 900 python scripts/enrich_official_assets.py >> audit/official-assets-observation.txt 2>&1
          echo "ENRICH_EXIT=$?" >> audit/official-assets-observation.txt
          python scripts/render_frontend.py >> audit/official-assets-observation.txt 2>&1
          echo "RENDER_EXIT=$?" >> audit/official-assets-observation.txt
          if [ -f public/official-asset-audit.json ]; then
            cat public/official-asset-audit.json >> audit/official-assets-observation.txt
          fi
          set -e
      - name: Commit observation and generated files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/official-assets-observation.txt
          test -f data/official_asset_cache.json && git add data/official_asset_cache.json || true
          test -f public/official-asset-audit.json && git add public/official-asset-audit.json public/events.json public/index.html || true
          git commit -m 'chore: record official asset observation [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
