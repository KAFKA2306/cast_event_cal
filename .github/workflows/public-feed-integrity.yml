name: Public feed integrity

on:
  pull_request:
    paths:
      - "public/events.json"
      - "scripts/audit_public_feed.py"
      - "scripts/check_upstream_conclusion.py"
      - "tests/test_audit_public_feed.py"
      - "tests/test_check_upstream_conclusion.py"
      - ".github/workflows/public-feed-integrity.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-feed-integrity.yml"
  workflow_run:
    workflows: ["Update calendar data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-feed-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-gate:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Record and propagate upstream conclusion
        id: gate
        continue-on-error: true
        run: |
          python scripts/check_upstream_conclusion.py \
            --conclusion "${{ github.event.workflow_run.conclusion }}" \
            --run-id "${{ github.event.workflow_run.id }}" \
            --head-sha "${{ github.event.workflow_run.head_sha }}" \
            --report build/upstream-workflow-run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-workflow-run
          path: build/upstream-workflow-run.json
          retention-days: 14
          if-no-files-found: error
      - name: Fail when upstream did not succeed
        if: steps.gate.outcome != 'success'
        run: exit 1

  audit:
    if: >-
      always() &&
      (github.event_name != 'workflow_run' || needs.upstream-gate.result == 'success')
    needs: [upstream-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check scripts/audit_public_feed.py scripts/check_upstream_conclusion.py tests/test_audit_public_feed.py tests/test_check_upstream_conclusion.py
      - run: pytest tests/test_audit_public_feed.py tests/test_check_upstream_conclusion.py
      - run: python scripts/audit_public_feed.py public/events.json --report build/public-feed-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-feed-audit
          path: build/public-feed-audit.json
          retention-days: 14
          if-no-files-found: error
