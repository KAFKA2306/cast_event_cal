name: Update calendar and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - cast_event_cal/**
      - config/**
      - data/recurring_events.json
      - data/one_off_events.json
      - data/x_events.json
      - scripts/**
      - tests/test_yahoo_archive_policy.py
      - web/**
      - main_executor.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/update-calendar-v2.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run archive-policy regression tests
        run: pytest -q tests/test_yahoo_archive_policy.py tests/test_yahoo_corpus.py
      - name: Materialize curated recurring events
        run: python scripts/materialize_events.py
      - name: Discover public VRChat calendar events
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python scripts/fetch_vrchat_calendar.py
      - name: Discover and classify X events
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_EVENT_MIN_RETWEETS: '3'
        run: python scripts/fetch_x_events.py
      - name: Extend Yahoo candidate corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/collect_yahoo_corpus.py --mode daily --target 1000
      - name: Replay retained Yahoo corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/refine_yahoo_corpus.py
      - name: Apply durable Yahoo archive policy
        run: python scripts/reclassify_yahoo_archive.py
      - name: Build normalized calendar and frontend
        run: |
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate generated data
        run: |
          set -euo pipefail
          grep -q 'VRChat Event Calendar' public/index.html
          grep -q 'BEGIN:VCALENDAR' public/calendar.ics
          python - <<'PY'
          import json
          from pathlib import Path

          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          vocabulary = json.loads(Path('public/yahoo-positive-vocabulary.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))

          assert history['schema_version'] == '2.4'
          assert history['candidate_count'] == len(history['candidates'])
          assert len({row['status_id'] for row in history['candidates']}) == history['candidate_count']
          assert audit['schema_version'] == '1.4'
          assert audit['classifier_version'] == '1.9'
          assert audit['accepted_count'] == len(yahoo)
          assert audit['rejected_count'] == len(rejected)
          assert audit['accepted_count'] + audit['rejected_count'] == history['candidate_count']
          assert audit['accepted_count'] > 59
          assert audit['past_accepted_count'] > 0
          assert audit['low_retweet_accepted_count'] > 0
          assert audit['rejection_reason_counts'].get('past_event', 0) == 0
          assert audit['rejection_reason_counts'].get('past_event_now', 0) == 0
          assert audit['rejection_reason_counts'].get('retweet_below_threshold', 0) == 0
          assert health['parser_version'] == '1.9'
          assert health['history_accepted_count'] == len(yahoo)
          assert health['history_rejected_count'] == len(rejected)
          assert vocabulary['minimum_retweets'] == 0
          assert events['count'] == len(events['events'])
          assert events['count'] > 555
          assert all(row.get('review_required') is False for row in yahoo)
          assert all(row.get('temporal_status') in {'past', 'upcoming'} for row in yahoo)
          assert all(isinstance(row.get('retweet_count'), int) and row['retweet_count'] >= 0 for row in yahoo)
          PY
      - name: Commit generated data safely
        run: |
          set -euo pipefail
          paths=(
            data/manual_events.json
            data/discovered_events.json
            data/discovery_health.json
            data/x_events.json
            data/x_discovery_health.json
            data/yahoo_realtime_candidates.json
            data/yahoo_realtime_events.json
            data/yahoo_realtime_rejected.json
            data/yahoo_realtime_health.json
            public
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${paths[@]}"
            git commit -m 'chore: refresh calendar with Yahoo archive policy [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Verify live Pages data
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          verified=false
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/yahoo-classifier-audit.json" -o /tmp/audit.json \
              && curl -fsS "$base/events.json" -o /tmp/events.json \
              && python - <<'PY'
          import json
          audit = json.load(open('/tmp/audit.json', encoding='utf-8'))
          events = json.load(open('/tmp/events.json', encoding='utf-8'))
          assert audit['classifier_version'] == '1.9'
          assert audit['accepted_count'] > 59
          assert audit['past_accepted_count'] > 0
          assert audit['low_retweet_accepted_count'] > 0
          assert events['count'] > 555
          PY
            then verified=true; break; fi
            sleep 10
          done
          test "$verified" = true
          mkdir -p audit
          PAGE_URL="$PAGE_URL" python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          classifier = json.load(open('/tmp/audit.json', encoding='utf-8'))
          events = json.load(open('/tmp/events.json', encoding='utf-8'))
          result = {
              'schema_version': '1.0',
              'verified_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'page_url': os.environ['PAGE_URL'],
              'classifier_version': classifier['classifier_version'],
              'yahoo_candidate_count': classifier['candidate_count'],
              'yahoo_accepted_count': classifier['accepted_count'],
              'yahoo_rejected_count': classifier['rejected_count'],
              'past_accepted_count': classifier['past_accepted_count'],
              'low_retweet_accepted_count': classifier['low_retweet_accepted_count'],
              'event_count': events['count'],
              'status': 'ok',
          }
          Path('audit/yahoo-archive-pages-verification.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Record production verification
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/yahoo-archive-pages-verification.json
          git commit -m 'chore: record Yahoo archive Pages verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
