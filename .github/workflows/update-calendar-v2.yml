name: Update calendar and deploy Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - cast_event_cal/**
      - config/**
      - data/recurring_events.json
      - data/one_off_events.json
      - data/x_events.json
      - scripts/**
      - tests/**
      - web/**
      - main_executor.py
      - requirements.txt
      - pyproject.toml
      - .github/workflows/update-calendar-v2.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Regression tests
        run: >-
          pytest -q
          tests/test_yahoo_archive_policy.py
          tests/test_yahoo_corpus.py
          tests/test_official_asset_enrichment.py
          tests/test_event_link_discovery.py
          tests/test_frontend_link_view.py
          tests/test_vrchat_group_assets.py
          tests/test_external_calendar_sources.py
          tests/test_vrchat_discovery_routes.py
      - name: Materialize curated recurring events
        run: python scripts/materialize_events.py
      - name: Discover public VRChat calendar events
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python scripts/fetch_vrchat_calendar.py
      - name: Discover and classify X events
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_EVENT_MIN_RETWEETS: '3'
        run: python scripts/fetch_x_events.py
      - name: Extend Yahoo candidate corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/collect_yahoo_corpus.py --mode daily --target 1000
      - name: Replay retained Yahoo corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/refine_yahoo_corpus.py
      - name: Apply durable Yahoo archive policy
        run: python scripts/reclassify_yahoo_archive.py
      - name: Collect external calendars and official event pages
        env:
          VRCEVE_DATA_USE_APPROVED: ${{ secrets.VRCEVE_DATA_USE_APPROVED }}
          VRCEVE_ICS_URL: ${{ secrets.VRCEVE_ICS_URL }}
        run: python scripts/fetch_external_calendars.py
      - name: Build normalized calendar
        run: python main_executor.py run --strict
      - name: Enrich official X Web and WebP assets
        run: python scripts/enrich_official_assets.py
      - name: Discover recruitment participation and related links
        run: python scripts/discover_event_links.py
      - name: Enrich official VRChat group images
        run: python scripts/enrich_vrchat_group_assets.py
      - name: Render linked-image frontend and live ontology
        run: python scripts/render_frontend.py
      - name: Validate generated data
        run: |
          set -euo pipefail
          grep -q 'VRChat Event Calendar' public/index.html
          grep -q 'event-media-link' public/index.html
          grep -q 'canonicalLinkKey' public/index.html
          grep -q 'preferredActionUrl' public/index.html
          grep -q 'BEGIN:VCALENDAR' public/calendar.ics
          python - <<'PY'
          import json
          from pathlib import Path

          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          assets = json.loads(Path('public/official-asset-audit.json').read_text(encoding='utf-8'))
          links = json.loads(Path('public/event-link-audit.json').read_text(encoding='utf-8'))
          groups = json.loads(Path('public/vrchat-group-asset-audit.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          external = json.loads(Path('data/external_discovery_health.json').read_text(encoding='utf-8'))
          rows = events['events']

          assert history['candidate_count'] == len(history['candidates'])
          assert audit['classifier_version'] == '1.9'
          assert audit['accepted_count'] == len(yahoo)
          assert audit['rejected_count'] == len(rejected)
          assert audit['accepted_count'] + audit['rejected_count'] == history['candidate_count']
          assert audit['accepted_count'] > 59
          assert audit['past_accepted_count'] > 0
          assert audit['low_retweet_accepted_count'] > 0
          assert health['parser_version'] == '1.9'
          assert events['count'] == len(rows) and events['count'] > 555
          assert assets['counts']['official_x'] > 0
          assert assets['counts']['webp_image'] > 0
          assert links['events_with_primary_action'] > 0
          assert groups['events_with_group_url'] > 0
          assert any(row.get('image_url') and row.get('primary_action_url') for row in rows)
          assert any(row.get('vrchat_group_url') for row in rows)
          assert ontology['schema_version'] == '2.0'
          assert ontology['source_event_count'] == len(rows)
          assert ontology['observed_entity_count'] > 2
          assert ontology['generated_at']
          assert external['schema_version'] == '1.0'
          assert external['status'] in {'ok', 'degraded', 'skipped'}
          names = {source['name'] for source in external['sources']}
          assert 'vrc_technology_academic_hub' in names
          assert 'official_event_websites' in names
          assert 'vrceve_authorized_feed' in names
          PY
      - name: Commit generated data safely
        run: |
          set -euo pipefail
          paths=(
            data/manual_events.json
            data/discovered_events.json
            data/discovery_health.json
            data/x_events.json
            data/x_discovery_health.json
            data/yahoo_realtime_candidates.json
            data/yahoo_realtime_events.json
            data/yahoo_realtime_rejected.json
            data/yahoo_realtime_health.json
            data/external_events.json
            data/external_discovery_health.json
            data/official_asset_cache.json
            public
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${paths[@]}"
            git commit -m 'chore: refresh calendar links images and ontology [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live Pages data
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          verified=false
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/events.json?attempt=$attempt" -o /tmp/events.json \
              && curl -fsS "$base/event-link-audit.json?attempt=$attempt" -o /tmp/links.json \
              && curl -fsS "$base/vrchat-group-asset-audit.json?attempt=$attempt" -o /tmp/groups.json \
              && curl -fsS "$base/event-ontology.json?attempt=$attempt" -o /tmp/ontology.json \
              && curl -fsS "$base/index.html?attempt=$attempt" -o /tmp/index.html \
              && python - <<'PY'
          import json
          events=json.load(open('/tmp/events.json',encoding='utf-8'))
          links=json.load(open('/tmp/links.json',encoding='utf-8'))
          groups=json.load(open('/tmp/groups.json',encoding='utf-8'))
          ontology=json.load(open('/tmp/ontology.json',encoding='utf-8'))
          html=open('/tmp/index.html',encoding='utf-8').read()
          assert events['count'] > 555
          assert links['events_with_primary_action'] > 0
          assert groups['events_with_group_url'] > 0
          assert any(e.get('vrchat_group_url') for e in events['events'])
          assert ontology['schema_version'] == '2.0'
          assert ontology['source_event_count'] == events['count']
          assert ontology['observed_entity_count'] > 2
          assert 'event-media-link' in html
          assert 'canonicalLinkKey' in html
          assert 'preferredActionUrl' in html
          PY
            then verified=true; break; fi
            sleep 10
          done
          test "$verified" = true
