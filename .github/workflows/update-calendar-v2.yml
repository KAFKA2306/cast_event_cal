name: Update calendar data
# Manual refresh trigger: 2026-08-09 JST

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - cast_event_cal/**
      - config/**
      - data/recurring_events.json
      - data/one_off_events.json
      - data/x_events.json
      - scripts/**
      - tests/**
      - web/**
      - requirements.txt
      - pyproject.toml
      - .github/workflows/update-calendar-v2.yml

permissions:
  contents: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest
      - name: Materialize curated recurring events
        run: python scripts/materialize_events.py
      - name: Discover public VRChat calendar events
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python scripts/fetch_vrchat_calendar.py
      - name: Discover and classify X events
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_EVENT_MIN_RETWEETS: '3'
        run: python scripts/fetch_x_events.py
      - name: Extend Yahoo candidate corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/collect_yahoo_corpus.py --mode daily --target 1000
      - name: Replay retained Yahoo corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/refine_yahoo_corpus.py
      - name: Apply durable Yahoo archive policy
        run: python scripts/reclassify_yahoo_archive.py
      - name: Collect external calendars and official event pages
        env:
          VRCEVE_DATA_USE_APPROVED: ${{ secrets.VRCEVE_DATA_USE_APPROVED }}
          VRCEVE_ICS_URL: ${{ secrets.VRCEVE_ICS_URL }}
        run: python scripts/fetch_external_calendars.py
      - name: Build normalized calendar
        run: cast-event-cal run --strict
      - name: Enrich official X Web and WebP assets
        run: python scripts/enrich_official_assets.py
      - name: Discover recruitment participation and related links
        run: python scripts/discover_event_links.py
      - name: Enrich official VRChat group images
        run: python scripts/enrich_vrchat_group_assets.py
      - name: Collapse duplicate source posts into canonical occurrences
        run: python scripts/deduplicate_occurrences.py
      - name: Render linked-image frontend and live ontologies
        run: python scripts/render_frontend.py
      - name: Render Unity distribution assets
        run: python scripts/render_distribution_assets.py
      - name: Build registration count audit
        run: python scripts/build_registration_count_audit.py
      - name: Validate generated data
        run: |
          set -euo pipefail
          grep -q 'VRChat Event Calendar' public/index.html
          grep -q 'event-media-link' public/index.html
          grep -q 'canonicalLinkKey' public/index.html
          grep -q 'preferredActionUrl' public/index.html
          grep -q 'category-ontology.json' public/index.html
          grep -q 'category_confidence' public/index.html
          grep -q 'href="use/"' public/index.html
          grep -q 'VRChatワールドへの掲示' public/use/index.html
          test -s public/media/poster-square.webp
          test -s public/media/poster-portrait.webp
          grep -q 'BEGIN:VCALENDAR' public/calendar.ics
          python - <<'PY'
          import json
          from pathlib import Path

          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          registration = json.loads(Path('public/registration-count-audit.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          duplicate_audit = json.loads(Path('public/event-duplicate-audit.json').read_text(encoding='utf-8'))
          assets = json.loads(Path('public/official-asset-audit.json').read_text(encoding='utf-8'))
          links = json.loads(Path('public/event-link-audit.json').read_text(encoding='utf-8'))
          groups = json.loads(Path('public/vrchat-group-asset-audit.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          category_ontology = json.loads(Path('public/category-ontology.json').read_text(encoding='utf-8'))
          ontology_audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          external = json.loads(Path('data/external_discovery_health.json').read_text(encoding='utf-8'))
          rows = events['events']

          assert history['candidate_count'] == len(history['candidates'])
          assert audit['classifier_version'] == '1.9'
          assert audit['accepted_count'] == len(yahoo)
          assert audit['rejected_count'] == len(rejected)
          assert audit['accepted_count'] + audit['rejected_count'] == history['candidate_count']
          assert audit['accepted_count'] > 59
          assert audit['past_accepted_count'] > 0
          assert audit['low_retweet_accepted_count'] > 0
          assert health['parser_version'] == '1.9'
          assert registration['schema_version'] == '1.0'
          assert registration['status'] == 'ok'
          assert registration['snapshot_count'] == len(registration['snapshots'])
          assert registration['latest']['calendar_event_count'] == events['count']
          assert registration['latest']['yahoo_candidate_count'] == history['candidate_count']
          assert registration['latest']['yahoo_accepted_count'] == len(yahoo)
          assert registration['latest']['yahoo_rejected_count'] == len(rejected)
          assert registration['latest']['yahoo_queries_failed'] == 0
          assert events['count'] == len(rows) and events['count'] > 555

          assert duplicate_audit['schema_version'] == '1.0'
          assert duplicate_audit['policy_version'] == 'canonical-occurrence.v1'
          assert duplicate_audit['event_count_after'] == events['count']
          assert duplicate_audit['event_count_before'] >= duplicate_audit['event_count_after']
          assert duplicate_audit['duplicate_occurrence_count'] == (
              duplicate_audit['event_count_before'] - duplicate_audit['event_count_after']
          )
          occurrence_ids = [row.get('occurrence_id') for row in rows]
          source_record_ids = [row.get('source_record_id') for row in rows]
          assert all(occurrence_ids)
          assert all(source_record_ids)
          assert len(occurrence_ids) == len(set(occurrence_ids))
          ics_uids = [
              line[4:]
              for line in Path('public/calendar.ics').read_text(encoding='utf-8').splitlines()
              if line.startswith('UID:')
          ]
          assert len(ics_uids) == events['count']
          assert len(ics_uids) == len(set(ics_uids))

          assert assets['counts']['official_x'] > 0
          assert assets['counts']['webp_image'] > 0
          assert links['events_with_primary_action'] > 0
          assert groups['events_with_group_url'] > 0
          assert any(row.get('image_url') and row.get('primary_action_url') for row in rows)
          assert any(row.get('vrchat_group_url') for row in rows)

          allowed_categories = {
              item['id']
              for item in category_ontology['categories']
              if isinstance(item, dict) and item.get('id')
          }
          allowed_modes = {'in_world', 'stream', 'hybrid', 'offline', 'deadline', 'unknown'}
          assert category_ontology['schema_version'] == '2.0'
          assert category_ontology['default_category'] == 'other'
          assert {'community', 'music', 'performance', 'game', 'learning', 'technology', 'art', 'world_tour', 'wellness', 'language_exchange', 'recruitment_deadline', 'other'} <= allowed_categories
          assert all(row.get('category') in allowed_categories for row in rows)
          assert all(row.get('event_mode') in allowed_modes for row in rows)
          assert all(isinstance(row.get('category_confidence'), (int, float)) for row in rows)
          assert not any(row.get('category') == 'event' for row in rows)

          assert ontology['schema_version'] == '3.0'
          assert ontology['category_ontology_schema_version'] == '2.0'
          assert ontology['source_event_count'] == len(rows)
          assert ontology['observed_entity_count'] > 2
          assert ontology['generated_at']
          assert sum(ontology['category_breakdown'].values()) == len(rows)
          assert ontology_audit['schema_version'] == '2.0'
          assert ontology_audit['category_classification']['event_count'] == len(rows)
          assert sum(ontology_audit['category_classification']['category_breakdown'].values()) == len(rows)

          assert external['schema_version'] == '1.0'
          assert external['status'] in {'ok', 'degraded', 'skipped'}
          names = {source['name'] for source in external['sources']}
          assert 'vrc_technology_academic_hub' in names
          assert 'official_event_websites' in names
          assert 'vrceve_authorized_feed' in names
          PY
      - name: Commit generated data safely
        run: |
          set -euo pipefail
          paths=(
            data/manual_events.json
            data/discovered_events.json
            data/discovery_health.json
            data/x_events.json
            data/x_discovery_health.json
            data/yahoo_realtime_candidates.json
            data/yahoo_realtime_events.json
            data/yahoo_realtime_rejected.json
            data/yahoo_realtime_health.json
            data/external_events.json
            data/external_discovery_health.json
            data/official_asset_cache.json
            public
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${paths[@]}"
            git commit -m 'chore: refresh calendar links images and ontology [skip ci]'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
