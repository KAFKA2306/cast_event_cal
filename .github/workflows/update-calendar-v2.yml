name: Update calendar data
# Manual refresh trigger: 2026-08-09 JST

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - cast_event_cal/**
      - config/**
      - data/recurring_events.json
      - data/one_off_events.json
      - scripts/**
      - tests/**
      - web/**
      - requirements.txt
      - pyproject.toml
      - .github/workflows/update-calendar-v2.yml
      - .github/workflows/render-search-pages.yml

permissions:
  contents: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      UPDATE_RUN_REPORT: /tmp/update-run-telemetry.jsonl
      UPDATE_RUN_SUMMARY: /tmp/update-run-telemetry.json
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Start run telemetry
        run: echo "UPDATE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest
      - name: Materialize curated recurring events
        run: python scripts/materialize_events.py
      - name: Discover public VRChat calendar events
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python scripts/fetch_vrchat_calendar.py
      - name: Discover and classify X events
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_EVENT_MIN_RETWEETS: '3'
        run: python scripts/fetch_x_events.py
      - name: Extend Yahoo candidate corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: >-
          python scripts/run_stage.py --report "$UPDATE_RUN_REPORT"
          --name yahoo-collection --kind network
          --input config --code-input scripts/collect_yahoo_corpus.py
          --output data/yahoo_realtime_candidates.json
          --measure-json data/yahoo_realtime_health.json --
          python scripts/collect_yahoo_corpus.py --mode daily --target 1000
      - name: Replay retained Yahoo corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/refine_yahoo_corpus.py
      - name: Apply durable Yahoo archive policy
        run: python scripts/reclassify_yahoo_archive.py
      - name: Collect external calendars and official event pages
        env:
          VRCEVE_DATA_USE_APPROVED: ${{ secrets.VRCEVE_DATA_USE_APPROVED }}
          VRCEVE_ICS_URL: ${{ secrets.VRCEVE_ICS_URL }}
        run: python scripts/fetch_external_calendars.py
      - name: Gate collection health before build
        run: |
          python - <<'PY'
          from scripts.validate_update_snapshot import OPTIONAL_COLLECTION_SOURCES, ROOT, require, sync_collection_health
          health = sync_collection_health(ROOT)
          statuses = {str(row.get('name')): str(row.get('status')) for row in health.get('sources', []) if isinstance(row, dict)}
          require(statuses.get('yahoo_realtime_events') == 'ok', f"Yahoo collection is not healthy: {statuses.get('yahoo_realtime_events')}")
          for name in OPTIONAL_COLLECTION_SOURCES:
              require(statuses.get(name) in {'ok', 'degraded', 'skipped'}, f"optional collection source has invalid status: {name}={statuses.get(name)}")
          print(f"collection health gate passed: {health.get('status')}")
          PY
      - name: Build normalized calendar
        run: cast-event-cal run --strict
      - name: Enrich official X Web and WebP assets
        run: python scripts/enrich_official_assets.py
      - name: Discover recruitment participation and related links
        run: python scripts/discover_event_links.py
      - name: Enrich official VRChat group images
        run: python scripts/enrich_vrchat_group_assets.py
      - name: Collapse duplicate source posts into canonical occurrences
        run: python scripts/deduplicate_occurrences.py
      - name: Render linked-image frontend and live ontologies
        run: >-
          python scripts/run_stage.py --report "$UPDATE_RUN_REPORT"
          --name render-frontend --kind projection
          --input public/events.json --input web --code-input scripts/render_frontend.py
          --output public/index.html --
          python scripts/render_frontend.py
      - name: Build validated promotion overlay
        run: python scripts/build_promotions.py
      - name: Order home view by user decision value
        run: python scripts/reorder_home_view.py
      - name: Render Unity distribution assets
        run: python scripts/render_distribution_assets.py
      - name: Build registration count audit
        run: python scripts/build_registration_count_audit.py
      - name: Audit canonical public feed
        run: python scripts/audit_public_feed.py public/events.json --report /tmp/public-feed-audit.json
      - name: Validate generated data and collection health
        run: python scripts/validate_update_snapshot.py
      - name: Write canonical snapshot identity
        run: python scripts/write_snapshot_identity.py
      - name: Verify canonical snapshot identity
        run: >-
          python scripts/run_stage.py --report "$UPDATE_RUN_REPORT"
          --name snapshot-identity-check --kind validation
          --input public/events.json --input public/snapshot.json
          --code-input scripts/write_snapshot_identity.py --
          python scripts/write_snapshot_identity.py --check public/snapshot.json
      - name: Gate generated snapshot freshness
        run: python scripts/audit_freshness.py --max-age-minutes 180
      - name: Finalize run telemetry
        if: always()
        run: python scripts/finalize_update_telemetry.py --report "$UPDATE_RUN_REPORT" --output "$UPDATE_RUN_SUMMARY"
      - name: Upload run telemetry
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: update-run-telemetry-${{ github.run_id }}
          path: /tmp/update-run-telemetry.json
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated data safely
        run: |
          set -euo pipefail
          paths=(
            data/manual_events.json
            data/discovered_events.json
            data/discovery_health.json
            data/x_events.json
            data/x_discovery_health.json
            data/yahoo_realtime_candidates.json
            data/yahoo_realtime_events.json
            data/yahoo_realtime_rejected.json
            data/yahoo_realtime_health.json
            data/external_events.json
            data/external_discovery_health.json
            data/official_asset_cache.json
            public
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${paths[@]}"
            git commit -m 'chore: refresh calendar links images and ontology'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
