name: Update calendar data
# Manual refresh trigger: 2026-08-09 JST

on:
  workflow_dispatch:
  schedule:
    - cron: '17 20 * * *'
  push:
    branches: [main]
    paths:
      - cast_event_cal/**
      - config/**
      - data/recurring_events.json
      - data/one_off_events.json
      # Generated discovery outputs are intentionally excluded to avoid self-trigger loops.
      - scripts/**
      - tests/**
      - web/**
      - requirements.txt
      - pyproject.toml
      - .github/workflows/update-calendar-v2.yml
      - .github/workflows/render-search-pages.yml

permissions:
  contents: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Initialize update telemetry
        run: |
          rm -f "$RUNNER_TEMP/update-stage-telemetry.jsonl" "$RUNNER_TEMP/update-run-telemetry.json"
          echo "UPDATE_STAGE_TELEMETRY=$RUNNER_TEMP/update-stage-telemetry.jsonl" >> "$GITHUB_ENV"
          echo "UPDATE_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name install_dependencies --kind setup --input pyproject.toml --input requirements.txt -- pip install -e '.[dev]'
      - name: Regression tests
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name regression_tests --kind validation --input cast_event_cal --input scripts --input tests --input pyproject.toml -- pytest
      - name: Materialize curated recurring events
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name materialize_curated_events --kind projection --input data/recurring_events.json --input data/one_off_events.json --output data/manual_events.json -- python scripts/materialize_events.py
      - name: Discover public VRChat calendar events
        env:
          VRCHAT_AUTH_COOKIE: ${{ secrets.VRCHAT_AUTH_COOKIE }}
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name collect_vrchat_calendar --kind network --input config --output data/discovered_events.json --output data/discovery_health.json --measure-json data/discovery_health.json -- python scripts/fetch_vrchat_calendar.py
      - name: Discover and classify X events
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_EVENT_MIN_RETWEETS: '3'
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name collect_x_events --kind network --input config --output data/x_events.json --output data/x_discovery_health.json --measure-json data/x_discovery_health.json -- python scripts/fetch_x_events.py
      - name: Extend Yahoo candidate corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name collect_yahoo_corpus --kind network --input config --output data/yahoo_realtime_candidates.json --output data/yahoo_realtime_health.json --measure-json data/yahoo_realtime_health.json -- python scripts/collect_yahoo_corpus.py --mode daily --target 1000
      - name: Replay retained Yahoo corpus
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name refine_yahoo_corpus --kind projection --input data/yahoo_realtime_candidates.json --input config --output data/yahoo_realtime_events.json --output data/yahoo_realtime_rejected.json --output public/yahoo-classifier-audit.json --measure-json data/yahoo_realtime_events.json --measure-json data/yahoo_realtime_rejected.json -- python scripts/refine_yahoo_corpus.py
      - name: Apply durable Yahoo archive policy
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name apply_yahoo_archive_policy --kind projection --input data/yahoo_realtime_candidates.json --input data/yahoo_realtime_events.json --input data/yahoo_realtime_rejected.json --output data/yahoo_realtime_candidates.json --output data/yahoo_realtime_events.json --output data/yahoo_realtime_rejected.json -- python scripts/reclassify_yahoo_archive.py
      - name: Collect external calendars and official event pages
        env:
          VRCEVE_DATA_USE_APPROVED: ${{ secrets.VRCEVE_DATA_USE_APPROVED }}
          VRCEVE_ICS_URL: ${{ secrets.VRCEVE_ICS_URL }}
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name collect_external_calendars --kind network --input config --output data/external_events.json --output data/external_discovery_health.json --measure-json data/external_discovery_health.json -- python scripts/fetch_external_calendars.py
      - name: Gate collection health before build
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name gate_collection_health --kind validation --input data/discovery_health.json --input data/x_discovery_health.json --input data/yahoo_realtime_health.json --input data/external_discovery_health.json --output public/health.json --measure-json public/health.json -- python scripts/gate_collection_health.py
      - name: Build normalized calendar
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name build_normalized_calendar --kind projection --input data --input config --input cast_event_cal --output public/events.json --output public/calendar.ics --output public/health.json --measure-json public/events.json --measure-json public/health.json -- cast-event-cal run --strict
      - name: Enrich official X Web and WebP assets
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name enrich_official_assets --kind network --input public/events.json --input data/official_asset_cache.json --output public/events.json --output data/official_asset_cache.json --output public/official-asset-audit.json --measure-json public/official-asset-audit.json -- python scripts/enrich_official_assets.py
      - name: Discover recruitment participation and related links
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name discover_event_links --kind network --input public/events.json --output public/events.json --output public/event-link-audit.json --measure-json public/event-link-audit.json -- python scripts/discover_event_links.py
      - name: Enrich official VRChat group images
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name enrich_vrchat_group_assets --kind network --input public/events.json --output public/events.json --output public/vrchat-group-asset-audit.json --measure-json public/vrchat-group-asset-audit.json -- python scripts/enrich_vrchat_group_assets.py
      - name: Collapse duplicate source posts into canonical occurrences
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name deduplicate_occurrences --kind projection --input public/events.json --output public/events.json --output public/event-duplicate-audit.json --measure-json public/event-duplicate-audit.json -- python scripts/deduplicate_occurrences.py
      - name: Render linked-image frontend and live ontologies
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name render_frontend --kind projection --input public/events.json --input config --input web --output public/index.html --output public/event-ontology.json --output public/category-ontology.json --output public/ontology-match-audit.json -- python scripts/render_frontend.py
      - name: Build validated promotion overlay
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name build_promotions --kind projection --input config/promotions.json --input public/events.json --output public/promotions.json --output public/promotions.js --measure-json public/promotions.json -- python scripts/build_promotions.py
      - name: Order home view by user decision value
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name reorder_home_view --kind projection --input public/index.html --output public/index.html -- python scripts/reorder_home_view.py
      - name: Render Unity distribution assets
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name render_distribution_assets --kind projection --input public/events.json --output public/use --output public/media/poster-square.webp --output public/media/poster-portrait.webp -- python scripts/render_distribution_assets.py
      - name: Build registration count audit
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name build_registration_count_audit --kind projection --input public/events.json --input data/yahoo_realtime_health.json --output public/registration-count-audit.json --measure-json public/registration-count-audit.json -- python scripts/build_registration_count_audit.py
      - name: Audit canonical public feed
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name audit_public_feed --kind validation --input public/events.json --output /tmp/public-feed-audit.json --measure-json /tmp/public-feed-audit.json -- python scripts/audit_public_feed.py public/events.json --report /tmp/public-feed-audit.json
      - name: Validate generated data and collection health
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name validate_update_snapshot --kind validation --input data --input public --output public/health.json --measure-json public/health.json -- python scripts/validate_update_snapshot.py
      - name: Write canonical snapshot identity
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name write_snapshot_identity --kind projection --input public/events.json --output public/snapshot.json --measure-json public/snapshot.json -- python scripts/write_snapshot_identity.py
      - name: Verify canonical snapshot identity
        run: python scripts/run_stage.py --report "$UPDATE_STAGE_TELEMETRY" --name verify_snapshot_identity --kind validation --input public/events.json --input public/snapshot.json -- python scripts/write_snapshot_identity.py --check public/snapshot.json
      - name: Summarize update telemetry
        run: python scripts/finalize_update_telemetry.py --report "$UPDATE_STAGE_TELEMETRY" --output "$RUNNER_TEMP/update-run-telemetry.json"
      - name: Commit generated data safely
        run: |
          set -euo pipefail
          paths=(
            data/manual_events.json
            data/discovered_events.json
            data/discovery_health.json
            data/x_events.json
            data/x_discovery_health.json
            data/yahoo_realtime_candidates.json
            data/yahoo_realtime_events.json
            data/yahoo_realtime_rejected.json
            data/yahoo_realtime_health.json
            data/external_events.json
            data/external_discovery_health.json
            data/official_asset_cache.json
            public
          )
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "${paths[@]}"
            git commit -m 'chore: refresh calendar links images and ontology'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
