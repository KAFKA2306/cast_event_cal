name: Audit Yahoo recovery patterns

on:
  push:
    branches: [feat/yahoo-v19-recovery]
    paths:
      - scripts/audit_yahoo_recovery_patterns.py
      - .github/workflows/audit-yahoo-recovery-patterns.yml
  pull_request:
    paths:
      - scripts/audit_yahoo_recovery_patterns.py
      - .github/workflows/audit-yahoo-recovery-patterns.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'feat/yahoo-v19-recovery' }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate rejection pattern audit
        run: python scripts/audit_yahoo_recovery_patterns.py
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-recovery-pattern-audit
          path: public/yahoo-recovery-pattern-audit.json
      - name: Commit audit on branch push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/yahoo-recovery-pattern-audit.json
          if git diff --cached --quiet; then
            echo 'Audit is current'
          else
            git commit -m 'chore: record Yahoo recovery patterns [skip ci]'
            git push origin HEAD:feat/yahoo-v19-recovery
          fi
