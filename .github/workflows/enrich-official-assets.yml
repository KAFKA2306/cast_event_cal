name: Enrich official event assets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - scripts/enrich_official_assets.py
      - scripts/discover_event_links.py
      - scripts/build_observed_ontology.py
      - scripts/render_frontend.py
      - tests/test_official_asset_enrichment.py
      - tests/test_event_link_discovery.py
      - .github/workflows/enrich-official-assets.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cast-event-calendar-official-assets
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_official_asset_enrichment.py tests/test_event_link_discovery.py
      - name: Enrich official X Web and WebP assets
        run: python scripts/enrich_official_assets.py
      - name: Discover participation and recruitment links
        run: python scripts/discover_event_links.py
      - name: Render frontend and live ontology
        run: python scripts/render_frontend.py
      - name: Validate generated evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          assets = json.loads(Path('public/official-asset-audit.json').read_text(encoding='utf-8'))
          links = json.loads(Path('public/event-link-audit.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          html = Path('public/index.html').read_text(encoding='utf-8')
          rows = events['events']
          assert events['count'] == len(rows)
          assert assets['counts']['official_x'] > 0
          assert assets['counts']['webp_image'] > 0
          assert links['events_with_primary_action'] > 0
          assert any(row.get('primary_action_url') for row in rows if row.get('image_url'))
          assert ontology['schema_version'] == '2.0'
          assert ontology['source_event_count'] == len(rows)
          assert ontology['observed_entity_count'] > 2
          assert ontology['generated_at']
          assert 'event-media-link' in html and 'primary_action_url' in html
          PY
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official_asset_cache.json public/events.json public/official-asset-audit.json public/event-link-audit.json public/event-ontology.json public/ontology-match-audit.json public/health.json public/index.html
          if git diff --cached --quiet; then
            echo 'Official assets already current'
          else
            git commit -m 'chore: enrich official links and live ontology [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed links images and ontology
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/events.json?attempt=$attempt" -o /tmp/events.json \
              && curl -fsS "$base/event-link-audit.json?attempt=$attempt" -o /tmp/links.json \
              && curl -fsS "$base/event-ontology.json?attempt=$attempt" -o /tmp/ontology.json \
              && curl -fsS "$base/index.html?attempt=$attempt" -o /tmp/index.html \
              && python - <<'PY'
          import json
          events = json.load(open('/tmp/events.json', encoding='utf-8'))
          links = json.load(open('/tmp/links.json', encoding='utf-8'))
          ontology = json.load(open('/tmp/ontology.json', encoding='utf-8'))
          html = open('/tmp/index.html', encoding='utf-8').read()
          assert links['events_with_primary_action'] > 0
          assert any(row.get('image_url') and row.get('primary_action_url') for row in events['events'])
          assert ontology['schema_version'] == '2.0'
          assert ontology['source_event_count'] == events['count']
          assert ontology['observed_entity_count'] > 2
          assert 'event-media-link' in html
          PY
            then exit 0; fi
            sleep 10
          done
          exit 1
