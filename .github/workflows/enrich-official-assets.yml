name: Enrich official event assets

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - scripts/enrich_official_assets.py
      - scripts/render_frontend.py
      - tests/test_official_asset_enrichment.py
      - .github/workflows/enrich-official-assets.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cast-event-calendar-official-assets
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Regression tests
        run: pytest -q tests/test_official_asset_enrichment.py
      - name: Enrich official links and WebP assets
        run: python scripts/enrich_official_assets.py
      - name: Render frontend
        run: python scripts/render_frontend.py
      - name: Validate generated evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/official-asset-audit.json').read_text(encoding='utf-8'))
          html = Path('public/index.html').read_text(encoding='utf-8')
          rows = events['events']
          counts = audit['counts']
          assert events['count'] == len(rows)
          assert counts['events'] == len(rows)
          assert counts['official_x'] > 0
          assert counts['webp_image'] > 0
          assert any(row.get('official_links') for row in rows)
          assert any(str(row.get('image_url') or '').find('format=webp') >= 0 for row in rows)
          assert 'event-media' in html
          assert '公式Web' in html and 'WebP画像' in html
          PY
      - name: Commit generated assets
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/official_asset_cache.json public/events.json public/official-asset-audit.json public/index.html
          if git diff --cached --quiet; then
            echo 'Official assets already current'
          else
            git commit -m 'chore: enrich official event assets [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: enrich
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed official assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for attempt in $(seq 1 30); do
            if curl -fsS "$base/official-asset-audit.json" -o /tmp/audit.json && curl -fsS "$base/events.json" -o /tmp/events.json && python - <<'PY'
          import json
          audit = json.load(open('/tmp/audit.json', encoding='utf-8'))
          events = json.load(open('/tmp/events.json', encoding='utf-8'))
          assert audit['counts']['official_x'] > 0
          assert audit['counts']['webp_image'] > 0
          assert any(row.get('official_x_url') for row in events['events'])
          assert any(row.get('image_url') for row in events['events'])
          PY
            then exit 0; fi
            sleep 10
          done
          exit 1
