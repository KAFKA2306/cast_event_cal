name: Bootstrap Yahoo candidate corpus

on:
  pull_request:
    branches: [main]
    paths:
      - config/yahoo_query_terms.json
      - scripts/collect_yahoo_corpus.py
      - tests/test_yahoo_corpus.py
      - .github/workflows/bootstrap-yahoo-corpus-pr.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-yahoo-corpus-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Bootstrap at least 1000 Yahoo candidates
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set -euo pipefail
          python scripts/collect_yahoo_corpus.py \
            --mode bootstrap \
            --target 1000 \
            --max-queries 140 \
            --delay-seconds 0.75 \
            --require-target
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate corpus and classifier audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          candidates = json.loads(Path('data/yahoo_realtime_candidates.json').read_text(encoding='utf-8'))
          events = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          public_events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))

          assert history['schema_version'] == '2.0'
          assert history['target_count'] == 1000
          assert history['target_reached'] is True
          assert history['candidate_count'] >= 1000
          assert history['candidate_count'] == len(history['candidates'])
          assert len({row['status_id'] for row in history['candidates']}) == history['candidate_count']
          assert sum(bool(row.get('query_keys')) for row in history['candidates']) >= 1000
          assert all(row.get('first_seen_at') and row.get('last_seen_at') for row in history['candidates'])

          assert candidates['candidate_count'] == len(candidates['candidates'])
          assert candidates['raw_candidate_count'] >= candidates['candidate_count']
          assert health['parser_version'] == '1.5'
          assert health['corpus_target_reached'] is True
          assert health['history_candidate_count'] == history['candidate_count']
          assert health['history_accepted_count'] == len(events)
          assert health['history_rejected_count'] == len(rejected)
          assert health['queries_succeeded'] > 0

          assert audit['classifier_version'] == '1.5'
          assert audit['target_reached'] is True
          assert audit['candidate_count'] == history['candidate_count']
          assert audit['accepted_count'] + audit['rejected_count'] == audit['candidate_count']
          assert audit['quality']['duplicate_status_ids'] == 0
          assert audit['quality']['missing_first_seen_at'] == 0
          assert audit['quality']['missing_last_seen_at'] == 0
          assert audit['quality']['ambiguous_decisions'] == 0
          assert isinstance(audit['rejection_reason_counts'], dict)
          assert isinstance(audit['high_retweet_rejections'], list)

          assert public_events['count'] == len(public_events['events'])
          assert public_events['count'] >= 250
          PY
      - name: Commit generated corpus and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manual_events.json data/yahoo_realtime_candidates.json data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
          git rm .github/workflows/bootstrap-yahoo-corpus-pr.yml
          if git diff --cached --quiet; then
            echo 'No generated corpus changes'
            exit 0
          fi
          git commit -m 'data: materialize 1000-candidate Yahoo corpus [skip ci]'
          git restore --worktree .
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
