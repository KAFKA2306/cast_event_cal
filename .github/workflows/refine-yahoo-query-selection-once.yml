name: Refine Yahoo query and selection policy once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-yahoo-query-selection-once.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Run observable migration
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set -uo pipefail
          mkdir -p /tmp/yahoo-v18
          stage=install
          status=0

          run_stage() {
            stage="$1"
            shift
            echo "===== $stage =====" | tee "/tmp/yahoo-v18/$stage.log"
            "$@" 2>&1 | tee -a "/tmp/yahoo-v18/$stage.log"
            return ${PIPESTATUS[0]}
          }

          run_stage install bash -c "python -m pip install --upgrade pip && pip install -e '.[dev]'" || status=$?

          if [ "$status" -eq 0 ]; then
            stage=repair
            python - <<'PY' 2>&1 | tee /tmp/yahoo-v18/repair.log
          from pathlib import Path

          path = Path('scripts/apply_yahoo_policy_v18.py')
          text = path.read_text(encoding='utf-8')
          folded = 'def structured_classify(text: str) -> tuple[str | None, str | None]:\n    folded = text.casefold()\n'
          repaired = 'def structured_classify(text: str) -> tuple[str | None, str | None]:\n'
          if folded not in text:
              raise SystemExit('unused folded assignment not found')
          text = text.replace(folded, repaired, 1)
          old = '    queries = "\\n".join(row["query"] for row in plan)'
          new = '    queries = "\\\\n".join(row["query"] for row in plan)'
          if old not in text:
              raise SystemExit('query newline literal not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -eq 0 ]; then
            run_stage apply python scripts/apply_yahoo_policy_v18.py || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            stage=logic
            python - <<'PY' 2>&1 | tee /tmp/yahoo-v18/logic.log
          from pathlib import Path

          path = Path('scripts/collect_yahoo_corpus.py')
          text = path.read_text(encoding='utf-8')

          marker = '''}
          PRIVATE_INSTANCE_TERMS = {'''
          insertion = '''}
          VR_ACCESS_TERMS = {
              "join", "ジョイン", "リクイン", "reqin", "リクエストインバイト", "request invite",
              "フレンド申請", "フレリク", "グループインスタンス", "group instance", "group+",
              "group public", "フレンドインスタンス", "join制", "インスタンスへ", "インスタンスに",
              "インスタンスオープン",
          }
          GENERIC_EVENT_NOUN_TERMS = {"イベント", "event"}
          PRIVATE_INSTANCE_TERMS = {'''
          if marker not in text:
              raise SystemExit('private instance marker not found')
          text = text.replace(marker, insertion, 1)

          old_attendance = '''ATTENDANCE_TERMS = {
              "参加", "ご参加", "来場", "ご来場", "ご来店", "遊びに来て", "お越し", "見に来て",
              "聴きに来て", "お待ちしております", "お待ちしてます", "入場",
          }'''
          new_attendance = '''ATTENDANCE_TERMS = {
              "参加したい", "参加できます", "参加ください", "ご参加ください", "来場", "ご来場",
              "ご来店", "遊びに来て", "お越し", "見に来て", "聴きに来て",
              "お待ちしております", "お待ちしてます", "入場",
          }'''
          if old_attendance not in text:
              raise SystemExit('attendance terms not found')
          text = text.replace(old_attendance, new_attendance, 1)

          old_features = '''    has_specific_event = has_any(text, SPECIFIC_EVENT_TERMS)
              has_action = has_any(text, EVENT_ACTION_TERMS)
              has_access = has_any(text, PARTICIPATION_TERMS)'''
          new_features = '''    has_specific_event = has_any(text, SPECIFIC_EVENT_TERMS)
              has_generic_event = has_any(text, GENERIC_EVENT_NOUN_TERMS)
              has_action = has_any(text, EVENT_ACTION_TERMS)
              has_access = has_any(text, VR_ACCESS_TERMS)'''
          if old_features not in text:
              raise SystemExit('classifier feature block not found')
          text = text.replace(old_features, new_features, 1)

          old_structure = '''    event_structure = has_specific_event or (has_action and has_access) or (has_access and has_attendance)'''
          new_structure = '''    event_structure = (
              has_specific_event
              or (has_generic_event and has_action)
              or (has_action and has_access)
              or (has_access and has_attendance)
          )'''
          if old_structure not in text:
              raise SystemExit('event structure expression not found')
          text = text.replace(old_structure, new_structure, 1)

          old_private = '''    if has_product and has_only_generic_event and not has_participation:
              return None, "product_only"

              event, reason = _ORIGINAL_CANDIDATE_TO_EVENT('''
          new_private = '''    if has_product and has_only_generic_event and not has_participation:
              return None, "product_only"
              if has_any(text, PRIVATE_INSTANCE_TERMS) and not has_participation:
              return None, "missing_participation_method"

              event, reason = _ORIGINAL_CANDIDATE_TO_EVENT('''
          if old_private not in text:
              raise SystemExit('private instance ordering block not found')
          text = text.replace(old_private, new_private, 1)

          path.write_text(text, encoding='utf-8')
          PY
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -eq 0 ]; then
            run_stage tests bash -c "ruff check cast_event_cal scripts tests main_executor.py && pytest tests" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_stage generate bash -c "python scripts/refine_yahoo_corpus.py && python main_executor.py run --strict && python scripts/render_frontend.py" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            stage=validate
            python - <<'PY' 2>&1 | tee /tmp/yahoo-v18/validate.log
          import json
          from pathlib import Path

          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          events = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          vocabulary = json.loads(Path('public/yahoo-positive-vocabulary.json').read_text(encoding='utf-8'))
          accepted_ids = {row['source_id'].split(':')[-1] for row in events}
          rejected_by_id = {row['status_id']: row['reason'] for row in rejected}
          history_by_id = {row['status_id']: row for row in history['candidates']}

          assert history['candidate_count'] >= 1000
          assert history['schema_version'] == '2.3'
          assert audit['schema_version'] == '1.3'
          assert audit['classifier_version'] == '1.8'
          assert audit['accepted_count'] == len(events)
          assert audit['accepted_count'] + audit['rejected_count'] == history['candidate_count']
          assert 31 < len(events) < 150
          assert '2074822308578173164' in accepted_ids
          assert '2083500973478330746' in accepted_ids
          assert rejected_by_id.get('2083398056188518660') == 'giveaway_only'
          assert rejected_by_id.get('2083153426167578665') == 'giveaway_only'
          assert all(
              int(history_by_id[status_id].get('max_retweet_count') or history_by_id[status_id].get('retweet_count') or 0) >= 3
              for status_id in accepted_ids
          )
          assert audit['quality']['duplicate_status_ids'] == 0
          assert audit['quality']['missing_source_created_at'] == 0
          assert audit['quality']['ambiguous_decisions'] == 0
          assert vocabulary['positive_event_count'] == len(events)
          assert vocabulary['minimum_retweets'] == 3
          assert {'イベント告知', '通常営業', 'リクイン'} & set(vocabulary['adopted_terms'])
          assert {'本日', '応募'} <= set(vocabulary['excluded_as_too_generic'])
          PY
            status=${PIPESTATUS[0]}
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          if [ "$status" -eq 0 ]; then
            git rm .github/workflows/refine-yahoo-query-selection-once.yml scripts/apply_yahoo_policy_v18.py
            git rm -f audit/yahoo-v18-migration-diagnostic.txt
            git add README.md config scripts tests .github/workflows/update-calendar-v2.yml data public audit
            git commit -m 'feat: improve Yahoo query and selection policy v1.8'
            git pull --rebase origin main
            git push origin HEAD:main
            exit 0
          fi

          git restore --worktree .
          {
            echo 'Yahoo v1.8 migration failed'
            echo "failed_stage=$stage"
            echo "status=$status"
            for file in /tmp/yahoo-v18/*.log; do
              echo
              echo "===== $file ====="
              cat "$file"
            done
          } > audit/yahoo-v18-migration-diagnostic.txt
          git add audit/yahoo-v18-migration-diagnostic.txt
          git commit -m 'chore: record Yahoo v1.8 migration failure [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
          exit "$status"
