name: Materialize Yahoo query and selection policy v1.8

on:
  pull_request:
    branches: [main]
    paths:
      - config/yahoo-v18-trigger.txt

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply v1.8 policy source migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/apply_yahoo_policy_v18.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def structured_classify(text: str) -> tuple[str | None, str | None]:\n    folded = text.casefold()\n',
              'def structured_classify(text: str) -> tuple[str | None, str | None]:\n',
              1,
          )
          text = text.replace(
              '    queries = "\\n".join(row["query"] for row in plan)',
              '    queries = "\\\\n".join(row["query"] for row in plan)',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python scripts/apply_yahoo_policy_v18.py
      - name: Separate event access from social participation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/collect_yahoo_corpus.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          def find_line(value: str, start: int = 0) -> int:
              for index in range(start, len(lines)):
                  if lines[index] == value:
                      return index
              raise RuntimeError(f'line not found: {value}')

          def replace_set(name: str, body: list[str]) -> None:
              start = find_line(f'{name} = {{')
              end = find_line('}', start + 1)
              lines[start:end + 1] = [f'{name} = {{', *[f'    {row}' for row in body], '}']

          private_index = find_line('PRIVATE_INSTANCE_TERMS = {')
          lines[private_index:private_index] = [
              'VR_ACCESS_TERMS = {',
              '    "join", "ジョイン", "リクイン", "reqin", "リクエストインバイト", "request invite",',
              '    "フレンド申請", "フレリク", "グループインスタンス", "group instance", "group+",',
              '    "group public", "フレンドインスタンス", "join制", "インスタンスへ", "インスタンスに",',
              '    "インスタンスオープン",',
              '}',
              'GENERIC_EVENT_NOUN_TERMS = {"イベント", "event"}',
          ]

          replace_set(
              'ATTENDANCE_TERMS',
              [
                  '"参加したい", "参加できます", "参加ください", "ご参加ください", "来場", "ご来場",',
                  '"ご来店", "遊びに来て", "お越し", "見に来て", "聴きに来て",',
                  '"お待ちしております", "お待ちしてます", "入場",',
              ],
          )

          feature_index = find_line('    has_specific_event = has_any(text, SPECIFIC_EVENT_TERMS)')
          lines.insert(feature_index + 1, '    has_generic_event = has_any(text, GENERIC_EVENT_NOUN_TERMS)')
          access_index = find_line('    has_access = has_any(text, PARTICIPATION_TERMS)', feature_index)
          lines[access_index] = '    has_access = has_any(text, VR_ACCESS_TERMS)'

          structure_index = find_line(
              '    event_structure = has_specific_event or (has_action and has_access) or (has_access and has_attendance)',
              feature_index,
          )
          lines[structure_index:structure_index + 1] = [
              '    event_structure = (',
              '        has_specific_event',
              '        or (has_generic_event and has_action)',
              '        or (has_action and has_access)',
              '        or (has_access and has_attendance)',
              '    )',
          ]

          refined_index = find_line('def refined_candidate_to_event(')
          call_index = find_line('    event, reason = _ORIGINAL_CANDIDATE_TO_EVENT(', refined_index)
          lines[call_index:call_index] = [
              '    if has_any(text, PRIVATE_INSTANCE_TERMS) and not has_participation:',
              '        return None, "missing_participation_method"',
              '',
          ]

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Run regression suite
        run: |
          ruff check cast_event_cal scripts tests main_executor.py
          pytest tests
      - name: Reclassify retained corpus and render
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          python scripts/refine_yahoo_corpus.py
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate corpus and precision guardrails
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          events = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          vocabulary = json.loads(Path('public/yahoo-positive-vocabulary.json').read_text(encoding='utf-8'))
          accepted_ids = {row['source_id'].split(':')[-1] for row in events}
          rejected_by_id = {row['status_id']: row['reason'] for row in rejected}
          history_by_id = {row['status_id']: row for row in history['candidates']}

          assert history['candidate_count'] >= 1000
          assert history['schema_version'] == '2.3'
          assert audit['schema_version'] == '1.3'
          assert audit['classifier_version'] == '1.8'
          assert audit['accepted_count'] == len(events)
          assert audit['accepted_count'] + audit['rejected_count'] == history['candidate_count']
          assert 31 < len(events) < 150
          assert '2074822308578173164' in accepted_ids
          assert '2083500973478330746' in accepted_ids
          assert rejected_by_id.get('2083398056188518660') == 'giveaway_only'
          assert rejected_by_id.get('2083153426167578665') == 'giveaway_only'
          assert all(
              int(history_by_id[status_id].get('max_retweet_count') or history_by_id[status_id].get('retweet_count') or 0) >= 3
              for status_id in accepted_ids
          )
          assert audit['quality']['duplicate_status_ids'] == 0
          assert audit['quality']['missing_source_created_at'] == 0
          assert audit['quality']['ambiguous_decisions'] == 0
          assert vocabulary['positive_event_count'] == len(events)
          assert vocabulary['minimum_retweets'] == 3
          assert {'イベント告知', '通常営業', 'リクイン'} & set(vocabulary['adopted_terms'])
          assert {'本日', '応募'} <= set(vocabulary['excluded_as_too_generic'])
          PY
      - name: Commit tested migration to PR branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm config/yahoo-v18-trigger.txt
          git rm .github/workflows/refine-yahoo-query-selection-once.yml scripts/apply_yahoo_policy_v18.py
          git rm -f audit/yahoo-v18-migration-diagnostic.txt
          git add README.md config scripts tests .github/workflows/update-calendar-v2.yml data public audit
          git commit -m 'feat: improve Yahoo query and selection policy v1.8 [skip ci]'
          git push origin HEAD:${{ github.head_ref }}
