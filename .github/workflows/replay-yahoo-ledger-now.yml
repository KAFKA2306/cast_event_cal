name: Replay Yahoo ledger now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replay-yahoo-ledger-now.yml

permissions:
  contents: write

concurrency:
  group: replay-yahoo-ledger-now
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Run replay with persistent diagnostics
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set +e
          mkdir -p audit
          : > audit/replay-yahoo-ledger.log
          status=0
          run_step() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a audit/replay-yahoo-ledger.log
            "$@" >> audit/replay-yahoo-ledger.log 2>&1
            code=$?
            echo "exit_code=$code" | tee -a audit/replay-yahoo-ledger.log
            if [ "$code" -ne 0 ] && [ "$status" -eq 0 ]; then status="$code"; fi
          }
          run_step install pip install -r requirements.txt
          if [ "$status" -eq 0 ]; then run_step materialize python scripts/materialize_events.py; fi
          if [ "$status" -eq 0 ]; then run_step replay python scripts/replay_yahoo_history.py; fi
          if [ "$status" -eq 0 ]; then run_step normalize python main_executor.py run --strict; fi
          if [ "$status" -eq 0 ]; then run_step render python scripts/render_frontend.py; fi
          if [ "$status" -eq 0 ]; then
            run_step verify python - <<'PY'
          import json
          from pathlib import Path
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          assert history['candidate_count'] >= 2
          assert history['retention_days'] == 30
          assert health['parser_version'] == '1.4'
          assert health['history_replay_mode'] == 'ledger_only'
          assert health['history_candidate_count'] == history['candidate_count']
          assert len(yahoo) >= 2
          assert audit['matched_events'] >= 2
          assert audit['ambiguous_events'] == 0
          assert sum(1 for item in events['events'] if item.get('ontology_id')) >= 2
          PY
          fi
          export REPLAY_STATUS="$status"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          Path('audit/replay-yahoo-ledger.json').write_text(
              json.dumps({
                  'schema_version': '1.0',
                  'generated_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
                  'status': 'ok' if os.environ['REPLAY_STATUS'] == '0' else 'failed',
                  'exit_code': int(os.environ['REPLAY_STATUS']),
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          echo "$status" > /tmp/replay-status
          exit 0
      - name: Commit outputs or diagnostic
        if: always()
        run: |
          set -euo pipefail
          status="$(cat /tmp/replay-status 2>/dev/null || echo 99)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/replay-yahoo-ledger.json audit/replay-yahoo-ledger.log
          if [ "$status" = '0' ]; then
            git add data/manual_events.json data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
            git rm .github/workflows/replay-yahoo-ledger-now.yml
          fi
          if [ "$status" = '0' ]; then
            git commit -m 'chore: replay Yahoo ledger and enrich ontology [skip ci]'
          else
            git commit -m 'audit: record Yahoo ledger replay failure [skip ci]'
          fi
          git pull --rebase origin main
          git push origin HEAD:main
          test "$status" = '0'
