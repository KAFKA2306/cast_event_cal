name: Replay Yahoo ledger now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replay-yahoo-ledger-now.yml

permissions:
  contents: write

concurrency:
  group: replay-yahoo-ledger-now
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Materialize from durable candidate history
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set -euo pipefail
          python scripts/materialize_events.py
          python scripts/replay_yahoo_history.py
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Verify replay and ontology output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          assert history['candidate_count'] >= 2
          assert history['retention_days'] == 30
          assert health['parser_version'] == '1.4'
          assert health['history_replay_mode'] == 'ledger_only'
          assert health['history_candidate_count'] == history['candidate_count']
          assert len(yahoo) >= 2
          assert audit['matched_events'] >= 2
          assert audit['ambiguous_events'] == 0
          assert sum(1 for item in events['events'] if item.get('ontology_id')) >= 2
          PY
      - name: Commit outputs and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manual_events.json data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
          git rm .github/workflows/replay-yahoo-ledger-now.yml
          git commit -m 'chore: replay Yahoo ledger and enrich ontology [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
