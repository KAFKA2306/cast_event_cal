name: Cleanup merged ontology branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-merged-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged branch
        run: git push origin --delete feat/event-ontology-automation
      - name: Remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cleanup-merged-branch.yml
          git commit -m 'chore: remove one-shot branch cleanup [skip ci]'
          git push origin main
