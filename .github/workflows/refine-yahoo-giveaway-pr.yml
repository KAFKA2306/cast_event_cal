name: Refine Yahoo giveaway classification

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/refine_yahoo_corpus.py
      - tests/test_yahoo_giveaway_rules.py
      - .github/workflows/refine-yahoo-giveaway-pr.yml

permissions:
  contents: write

concurrency:
  group: refine-yahoo-giveaway-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Apply giveaway/event-access distinction
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set -euo pipefail
          python scripts/refine_yahoo_corpus.py
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate known false positives and corpus invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          events = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))

          rejected_by_id = {row['status_id']: row['reason'] for row in rejected}
          accepted_ids = {row['source_id'].split(':')[-1] for row in events}
          assert history['schema_version'] == '2.2'
          assert history['candidate_count'] >= 1000
          assert history['giveaway_policy'] == 'require_specific_event_or_vrchat_access_method'
          assert health['parser_version'] == '1.7'
          assert health['giveaway_policy'] == history['giveaway_policy']
          assert audit['schema_version'] == '1.2'
          assert audit['classifier_version'] == '1.7'
          assert audit['candidate_count'] == history['candidate_count']
          assert audit['accepted_count'] == len(events)
          assert audit['accepted_count'] + audit['rejected_count'] == audit['candidate_count']
          assert rejected_by_id['2083398056188518660'] == 'giveaway_only'
          assert rejected_by_id['2083153426167578665'] == 'giveaway_only'
          assert '2083398056188518660' not in accepted_ids
          assert '2083153426167578665' not in accepted_ids
          assert '2083770096582119685' in accepted_ids
          assert '2082990245176586249' in accepted_ids
          assert audit['quality']['duplicate_status_ids'] == 0
          assert audit['quality']['missing_source_created_at'] == 0
          PY
      - name: Commit refined outputs and remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
          git rm .github/workflows/refine-yahoo-giveaway-pr.yml
          git commit -m 'data: remove product-giveaway false positives [skip ci]'
          git restore --worktree .
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
