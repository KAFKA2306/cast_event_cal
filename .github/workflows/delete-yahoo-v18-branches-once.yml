name: Delete completed Yahoo v1.8 branches once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-yahoo-v18-branches-once.yml

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete remaining completed work branches
        run: |
          set -euo pipefail
          for branch in \
            feat/yahoo-v18-materialize \
            feat/yahoo-v18-merge-ready; do
            git push origin --delete "$branch" || true
          done

# retry-after-pr-closure
