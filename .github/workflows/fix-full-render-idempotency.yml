name: One-time full render idempotency fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-full-render-idempotency.yml

permissions:
  contents: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Normalize root crawl block insertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/render_internal_links.py')
          text = path.read_text(encoding='utf-8')
          old_hub = '    root = replace_block(root, ROOT_HUB_START, ROOT_HUB_END, hubs, "<footer>")'
          new_hub = '    root = strip_block(root, ROOT_HUB_START, ROOT_HUB_END)'
          old_events = '    root = replace_block(root, ROOT_EVENTS_START, ROOT_EVENTS_END, all_events, "<footer>")'
          new_events = '    root = re.sub(r"\\n*<footer>", "<footer>", root, count=1)\n    root_blocks = (\n        f"\\n{ROOT_HUB_START}{hubs}{ROOT_HUB_END}"\n        f"\\n{ROOT_EVENTS_START}{all_events}{ROOT_EVENTS_END}\\n"\n    )\n    root = root.replace("<footer>", root_blocks + "<footer>", 1)'
          if text.count(old_hub) != 1 or text.count(old_events) != 1:
              raise SystemExit('expected root crawl insertion targets')
          path.write_text(text.replace(old_hub, new_hub).replace(old_events, new_events), encoding='utf-8')

          test_path = Path('tests/test_crawl_graph.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '\ndef test_crawl_graph_ignores_download_links_but_not_page_links(tmp_path: Path) -> None:\n'
          addition = '\ndef test_full_search_surface_render_is_idempotent(tmp_path: Path) -> None:\n    root = _build_surface(tmp_path)\n    first = (root / "index.html").read_text(encoding="utf-8")\n    base = "https://example.test/project"\n\n    render_events(root / "events.json", root, base)\n    render_categories(root / "events.json", root / "category-ontology.json", root, base)\n    render_series(root / "events.json", root / "event-ontology.json", root, base)\n    render_links(root)\n\n    second = (root / "index.html").read_text(encoding="utf-8")\n    assert second == first\n\n'
          if test.count(marker) != 1:
              raise SystemExit('expected crawl graph test insertion marker')
          test_path.write_text(test.replace(marker, addition + marker), encoding='utf-8')
          PY
      - name: Run focused regression tests
        run: pytest tests/test_search_pages.py tests/test_crawl_graph.py -q
      - name: Prove real root pipeline is byte-idempotent
        run: |
          set -euo pipefail
          run_root_pipeline() {
            python scripts/render_search_pages.py
            python scripts/render_category_pages.py
            python scripts/render_series_pages.py
            python scripts/render_internal_links.py
          }
          run_root_pipeline
          sha256sum public/index.html | cut -d' ' -f1 > /tmp/first.sha
          run_root_pipeline
          sha256sum public/index.html | cut -d' ' -f1 > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha
          test "$(grep -c '<!-- searchable-events:start -->' public/index.html)" -eq 1
          test "$(grep -c '<!-- crawl-hubs:start -->' public/index.html)" -eq 1
          test "$(grep -c '<!-- crawl-all-events:start -->' public/index.html)" -eq 1
      - name: Commit source, regression test, and normalized root
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/render_internal_links.py tests/test_crawl_graph.py public/index.html public/categories public/series public/events public/sitemap.xml
          git diff --cached --check -- scripts/render_internal_links.py tests/test_crawl_graph.py public/index.html
          git commit -m 'fix: make full search surface rendering idempotent'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
