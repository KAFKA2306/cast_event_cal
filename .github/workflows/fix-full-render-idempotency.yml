name: One-time full render idempotency fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-full-render-idempotency.yml

permissions:
  contents: write

concurrency:
  group: cast-event-calendar-production
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Preserve existing search section position
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/render_search_pages.py')
          text = path.read_text(encoding='utf-8')
          old_remove = '    text = re.sub(r"\\n*" + re.escape(start_marker) + r".*?" + re.escape(end_marker) + r"\\n*", "", text, flags=re.S)'
          new_prepare = '    section = f"{start_marker}\\n{root_preview(events)}\\n{end_marker}"\n    search_block = r"\\n*" + re.escape(start_marker) + r".*?" + re.escape(end_marker) + r"\\n*"'
          old_insert = '    section = f"{start_marker}\\n{root_preview(events)}\\n{end_marker}"\n    text = text.replace(marker, "\\n" + section + "\\n" + marker, 1)'
          new_insert = '    if re.search(search_block, text, flags=re.S):\n        text = re.sub(search_block, "\\n" + section + "\\n", text, count=1, flags=re.S)\n    else:\n        text = text.replace(marker, "\\n" + section + "\\n" + marker, 1)'
          if text.count(old_remove) != 1 or text.count(old_insert) != 1:
              raise SystemExit('expected search section patch targets')
          path.write_text(text.replace(old_remove, new_prepare).replace(old_insert, new_insert), encoding='utf-8')

          test_path = Path('tests/test_crawl_graph.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '\ndef test_crawl_graph_ignores_download_links_but_not_page_links(tmp_path: Path) -> None:\n'
          addition = '\ndef test_full_search_surface_render_is_idempotent(tmp_path: Path) -> None:\n    root = _build_surface(tmp_path)\n    first = (root / "index.html").read_text(encoding="utf-8")\n    base = "https://example.test/project"\n\n    render_events(root / "events.json", root, base)\n    render_categories(root / "events.json", root / "category-ontology.json", root, base)\n    render_series(root / "events.json", root / "event-ontology.json", root, base)\n    render_links(root)\n\n    second = (root / "index.html").read_text(encoding="utf-8")\n    assert second == first\n\n'
          if test.count(marker) != 1:
              raise SystemExit('expected crawl graph test insertion marker')
          test_path.write_text(test.replace(marker, addition + marker), encoding='utf-8')
          PY
      - name: Run focused regression tests
        run: pytest tests/test_search_pages.py tests/test_crawl_graph.py -q
      - name: Prove real root pipeline is byte-idempotent
        run: |
          set -euo pipefail
          run_root_pipeline() {
            python scripts/render_search_pages.py
            python scripts/render_category_pages.py
            python scripts/render_series_pages.py
            python scripts/render_internal_links.py
          }
          run_root_pipeline
          sha256sum public/index.html | cut -d' ' -f1 > /tmp/first.sha
          run_root_pipeline
          sha256sum public/index.html | cut -d' ' -f1 > /tmp/second.sha
          diff -u /tmp/first.sha /tmp/second.sha
          test "$(grep -c '<!-- searchable-events:start -->' public/index.html)" -eq 1
          test "$(grep -c '<!-- crawl-hubs:start -->' public/index.html)" -eq 1
          test "$(grep -c '<!-- crawl-all-events:start -->' public/index.html)" -eq 1
      - name: Commit source, regression test, and normalized root
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/render_search_pages.py tests/test_crawl_graph.py public/index.html public/categories public/series public/events public/sitemap.xml
          git diff --cached --check -- scripts/render_search_pages.py tests/test_crawl_graph.py public/index.html
          git commit -m 'fix: preserve search section position during rendering'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
