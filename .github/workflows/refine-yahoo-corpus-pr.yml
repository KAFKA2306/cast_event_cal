name: Refine Yahoo corpus with source timestamps

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/refine_yahoo_corpus.py
      - tests/test_yahoo_source_time.py
      - .github/workflows/refine-yahoo-corpus-pr.yml

permissions:
  contents: write

concurrency:
  group: refine-yahoo-corpus-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  refine:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Reclassify complete corpus by source timestamp
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set -euo pipefail
          python scripts/refine_yahoo_corpus.py
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate source-time refinement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          events = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          rejected = json.loads(Path('data/yahoo_realtime_rejected.json').read_text(encoding='utf-8'))
          health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          public_events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))

          assert history['schema_version'] == '2.1'
          assert history['candidate_count'] >= 1000
          assert history['target_reached'] is True
          assert history['source_time_policy'] == 'x_snowflake_created_at_then_first_seen_at'
          assert sum(bool(row.get('source_created_at')) for row in history['candidates']) >= 1000
          assert health['parser_version'] == '1.6'
          assert health['source_timestamp_count'] >= 1000
          assert health['history_candidate_count'] == history['candidate_count']
          assert health['history_accepted_count'] == len(events)
          assert health['history_rejected_count'] == len(rejected)
          assert audit['schema_version'] == '1.1'
          assert audit['classifier_version'] == '1.6'
          assert audit['candidate_count'] == history['candidate_count']
          assert audit['accepted_count'] == len(events)
          assert audit['accepted_count'] + audit['rejected_count'] == audit['candidate_count']
          assert audit['rejection_reason_counts'].get('past_event_now', 0) > 0
          assert audit['quality']['duplicate_status_ids'] == 0
          assert audit['quality']['missing_source_created_at'] == 0
          assert audit['quality']['ambiguous_decisions'] == 0
          assert public_events['count'] == len(public_events['events'])
          assert public_events['count'] >= 250
          PY
      - name: Commit refined outputs and remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
          git rm .github/workflows/refine-yahoo-corpus-pr.yml
          git commit -m 'data: reclassify Yahoo corpus by source timestamp [skip ci]'
          git restore --worktree .
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
