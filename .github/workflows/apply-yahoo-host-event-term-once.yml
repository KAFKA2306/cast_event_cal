name: Apply audited Yahoo host-event term once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-yahoo-host-event-term-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Apply deterministic classifier patch and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/collect_yahoo_corpus.py')
          text = source.read_text(encoding='utf-8')
          old = '"イベント告知", "営業告知", "通常営業", "開催決定", "ホストイベント", "交流イベント",'
          new = '"イベント告知", "営業告知", "通常営業", "開催決定", "ホストイベント", "ホスイベ", "交流イベント",'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one classifier anchor, found {text.count(old)}')
          source.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_yahoo_corpus.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = 'def test_host_event_abbreviation_with_explicit_schedule_is_accepted():'
          if marker not in test_text:
              test_text += '''\n\n\ndef test_host_event_abbreviation_with_explicit_schedule_is_accepted():\n    configure_classifier()\n    event, reason = refined_candidate_to_event(\n        candidate(\n            "VRCで1番ド派手なホスイベ Attrazione。"\n            "8月度姫救済特別営業は2026年8月15日22時始動。"\n            "姫様のご来店をお待ちしております。#VRChat",\n            retweets=36,\n        ),\n        now=datetime(2026, 8, 4, tzinfo=UTC),\n        min_retweets=3,\n        x_ids=set(),\n    )\n    assert reason is None\n    assert event is not None\n    assert event["starts_at"].startswith("2026-08-15T22:00:00")\n'''
              tests.write_text(test_text, encoding='utf-8')

          Path('.github/workflows/apply-yahoo-host-event-term-once.yml').unlink()
          PY
      - name: Run focused regression tests
        run: pytest -q tests/test_yahoo_corpus.py
      - name: Commit audited fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/collect_yahoo_corpus.py tests/test_yahoo_corpus.py .github/workflows/apply-yahoo-host-event-term-once.yml
          git commit -m 'fix: recognize explicit VRChat host-event abbreviation'
          git pull --rebase origin main
          git push origin HEAD:main
