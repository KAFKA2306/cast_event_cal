name: Public browser regression (navigation and URL state)
on:
  pull_request:
    paths:
      - 'scripts/audit_mobile_navigation.py'
      - 'scripts/audit_tonight_url_browser.py'
      - 'public/tonight/**'
      - '.github/workflows/mobile-navigation-audit.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_mobile_navigation.py'
      - 'public/tonight/**'
      - '.github/workflows/mobile-navigation-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned browser runner
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Audit generated Tonight navigation without modifying production
        run: python scripts/audit_mobile_navigation.py --output-dir mobile-audit
      - name: Verify bounded Tonight URL state in Chromium
        run: python scripts/audit_tonight_url_browser.py --output-dir tonight-url-browser-audit
      - name: Save URL-state browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tonight-url-browser-audit
          path: tonight-url-browser-audit/
          if-no-files-found: error
      - name: Save measured findings and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-navigation-audit
          path: mobile-audit/
          if-no-files-found: error
