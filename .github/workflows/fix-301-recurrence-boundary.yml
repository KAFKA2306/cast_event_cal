name: Fix 301 recurrence boundary
on:
  push:
    branches: [fix/301-recurrence-clause-boundary]
    paths: [.github/workflows/fix-301-recurrence-boundary.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/301-recurrence-clause-boundary
      - name: Apply shared clause-boundary gate
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/relative_datetime.py')
          s = p.read_text()
          needle = '''def _recurrence_clause_has_event_identity(text: str, match: re.Match[str]) -> bool:\n'''
          helper = '''def _recurrence_match_stays_in_clause(text: str, match: re.Match[str]) -> bool:\n    """Reject a recurrence match whose captured clock belongs to a later rule."""\n    groupdict = match.groupdict()\n    clock_start = match.start("period") if groupdict.get("period") else match.start("hour")\n    next_marker = RECURRENCE_MARKER_RE.search(text, match.start() + 1, clock_start)\n    return next_marker is None\n\n\n'''
          if helper not in s:
              s = s.replace(needle, helper + needle, 1)
          old = 'if match and _recurrence_clause_has_event_identity(normalized, match):'
          new = 'if (\n        match\n        and _recurrence_match_stays_in_clause(normalized, match)\n        and _recurrence_clause_has_event_identity(normalized, match)\n    ):'
          count = s.count(old)
          if count != 7:
              raise SystemExit(f'expected 7 recurrence paths, found {count}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Run focused regression
        run: python -m pytest -q tests/test_recurrence_clause_boundary.py
      - name: Commit patch and remove bootstrap workflow
        run: |
          rm .github/workflows/fix-301-recurrence-boundary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/relative_datetime.py .github/workflows/fix-301-recurrence-boundary.yml
          git commit -m 'fix: stop recurrence clock capture across clauses'
          git push
