name: Materialize Yahoo history and ontology once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-history-ontology-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-history-ontology-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Run and capture production generation
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set +e
          mkdir -p audit
          : > audit/materialize-history-ontology.log
          status=0
          run_step() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a audit/materialize-history-ontology.log
            "$@" >> audit/materialize-history-ontology.log 2>&1
            code=$?
            echo "exit_code=$code" | tee -a audit/materialize-history-ontology.log
            if [ "$code" -ne 0 ] && [ "$status" -eq 0 ]; then status="$code"; fi
          }
          run_step install pip install -r requirements.txt
          if [ "$status" -eq 0 ]; then run_step materialize python scripts/materialize_events.py; fi
          if [ "$status" -eq 0 ]; then run_step yahoo python scripts/run_yahoo_realtime.py; fi
          if [ "$status" -eq 0 ]; then run_step normalize python main_executor.py run --strict; fi
          if [ "$status" -eq 0 ]; then run_step render python scripts/render_frontend.py; fi
          if [ "$status" -eq 0 ]; then
            run_step validate python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          yahoo_health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          ontology_audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))

          assert history['candidate_count'] >= 2
          assert history['retention_days'] == 30
          assert len(yahoo) >= 2
          assert yahoo_health['parser_version'] == '1.4'
          assert yahoo_health['history_candidate_count'] == history['candidate_count']
          assert ontology['schema_version'] == '1.1'
          assert ontology_audit['ontology_entries'] >= 2
          assert ontology_audit['matched_events'] >= 2
          assert ontology_audit['ambiguous_events'] == 0
          assert events['count'] == len(events['events'])
          assert health['event_count'] == events['count']
          assert health['ontology']['matched_events'] >= 2
          ids = {item.get('source_id') for item in yahoo}
          assert 'yahoo:x:2083770096582119685' in ids
          assert 'yahoo:x:2083738482703466864' in ids
          enriched = [item for item in events['events'] if item.get('ontology_id')]
          assert len(enriched) >= 2
          assert all(item.get('official_links') for item in enriched)
          PY
          fi
          export MATERIALIZE_STATUS="$status"
          python - <<'PY'
          import json, os
          from datetime import UTC, datetime
          from pathlib import Path
          result = {
              'schema_version': '1.0',
              'generated_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'status': 'ok' if os.environ['MATERIALIZE_STATUS'] == '0' else 'failed',
              'exit_code': int(os.environ['MATERIALIZE_STATUS']),
          }
          Path('audit/materialize-history-ontology.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          echo "$status" > /tmp/materialize-status
          exit 0
      - name: Commit generated evidence or diagnostic
        if: always()
        run: |
          set -euo pipefail
          status="$(cat /tmp/materialize-status 2>/dev/null || echo 99)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/materialize-history-ontology.json audit/materialize-history-ontology.log
          if [ "$status" = '0' ]; then
            git add data/manual_events.json data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
            git rm .github/workflows/materialize-history-ontology-once.yml
          fi
          if ! git diff --cached --quiet; then
            if [ "$status" = '0' ]; then
              git commit -m 'chore: materialize Yahoo history and ontology [skip ci]'
            else
              git commit -m 'audit: record Yahoo history materialization failure [skip ci]'
            fi
            git pull --rebase origin main
            git push origin main
          fi
          test "$status" = '0'
