name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - public/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check cast_event_cal scripts tests main_executor.py
      - run: pytest tests
      - run: python main_executor.py validate
      - run: python scripts/materialize_events.py
      - name: Exercise credential-free discovery fallback
        run: |
          unset VRCHAT_AUTH_COOKIE
          python scripts/fetch_vrchat_calendar.py
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('data/discovery_health.json').read_text(encoding='utf-8'))
          assert health['status'] == 'skipped'
          assert health['event_count'] == len(json.loads(Path('data/discovered_events.json').read_text(encoding='utf-8')))
          PY
      - name: Enforce useful event coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          events = json.loads(Path('data/manual_events.json').read_text(encoding='utf-8'))
          assert len(events) >= 60, f'event coverage too small: {len(events)}'
          assert len({item['source_id'] for item in events}) == len(events)
          PY
      - run: python main_executor.py run --strict
