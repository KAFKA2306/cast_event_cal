name: CI

# One focused PR check. Runtime publication validates its generated artifacts separately.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: ruff check cast_event_cal scripts tests
      - run: pytest -q
      - name: Check browser analytics privacy
        run: node tests/browser_analytics_privacy.cjs
      - name: Check independent watchdog safety
        run: node --test ops/cloudflare-watchdog/worker.test.mjs
