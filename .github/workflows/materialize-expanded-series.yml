name: Materialize expanded series links

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-expanded-series.yml

permissions:
  contents: write

concurrency:
  group: materialize-expanded-series
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Test and regenerate
        run: |
          pytest -q tests/test_event_series_ontology.py
          python -m cast_event_cal.ontology
          PYTHONPATH=. python scripts/build_observed_ontology.py
      - name: Validate generated audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          expected = {
              'asmr-gathering': 34,
              'en-jp-language-exchange': 34,
              'vrc-goita': 18,
              'yuruge-meet': 17,
              'wednesday-quest-beginners': 17,
              'zerozoku-auction': 1,
          }
          assert events['count'] == 595
          assert ontology['curated_entry_count'] == 7
          assert audit['ontology_entries'] == 7
          assert audit['matched_events'] == 121
          assert audit['unmatched_events'] == 474
          assert audit['ambiguous_events'] == 0
          assert audit['matched_series'] == expected
          assert sum(bool(row.get('series_profile')) for row in events['events']) == 121
          print(json.dumps({
              'event_count': events['count'],
              'matched_events': audit['matched_events'],
              'matched_series': audit['matched_series'],
              'ambiguous_events': audit['ambiguous_events'],
          }, ensure_ascii=False))
          PY
      - name: Commit generated data and remove workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/materialize-expanded-series.yml
          git add .github/workflows/materialize-expanded-series.yml \
            public/events.json public/event-ontology.json \
            public/ontology-match-audit.json public/health.json
          git commit -m 'chore: materialize expanded series links [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
