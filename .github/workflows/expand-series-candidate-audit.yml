name: Audit unmatched event series candidates

on:
  push:
    branches: [agent/expand-series-links-2]
    paths:
      - .github/workflows/expand-series-candidate-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build concise unmatched-series summaries
        run: |
          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          payload = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          rows = payload.get('events', payload if isinstance(payload, list) else [])
          unmatched = [row for row in rows if not row.get('series_profile')]

          def clean(value):
              if value is None:
                  return ''
              if isinstance(value, (list, dict)):
                  value = json.dumps(value, ensure_ascii=False, separators=(',', ':'))
              return str(value).replace('\t', ' ').replace('\r', ' ').replace('\n', ' ').strip()

          by_title = collections.defaultdict(list)
          by_organizer = collections.defaultdict(list)
          for row in unmatched:
              title = clean(row.get('title'))
              organizer = clean(row.get('organizer'))
              if title:
                  by_title[title].append(row)
              if organizer:
                  by_organizer[organizer].append(row)

          title_lines = ['count\ttitle\torganizers\tdescription\tvrchat_group_url\turl\tsource']
          for title, items in sorted(by_title.items(), key=lambda pair: (-len(pair[1]), pair[0])):
              if len(items) < 2:
                  continue
              organizers = sorted({clean(item.get('organizer')) for item in items if clean(item.get('organizer'))})
              sample = items[0]
              title_lines.append('\t'.join([
                  str(len(items)),
                  title,
                  ' | '.join(organizers),
                  clean(sample.get('description')),
                  clean(sample.get('vrchat_group_url')),
                  clean(sample.get('url')),
                  clean(sample.get('source')),
              ]))

          organizer_lines = ['count\torganizer\tdistinct_titles\tsample_titles\tvrchat_group_urls\tsources']
          for organizer, items in sorted(by_organizer.items(), key=lambda pair: (-len(pair[1]), pair[0])):
              if len(items) < 2:
                  continue
              titles = sorted({clean(item.get('title')) for item in items if clean(item.get('title'))})
              groups = sorted({clean(item.get('vrchat_group_url')) for item in items if clean(item.get('vrchat_group_url'))})
              sources = sorted({clean(item.get('source')) for item in items if clean(item.get('source'))})
              organizer_lines.append('\t'.join([
                  str(len(items)),
                  organizer,
                  str(len(titles)),
                  ' | '.join(titles[:8]),
                  ' | '.join(groups),
                  ' | '.join(sources),
              ]))

          Path('series-candidate-titles.tsv').write_text('\n'.join(title_lines) + '\n', encoding='utf-8')
          Path('series-candidate-organizers.tsv').write_text('\n'.join(organizer_lines) + '\n', encoding='utf-8')
          print(json.dumps({
              'events': len(rows),
              'unmatched': len(unmatched),
              'repeated_titles': len(title_lines) - 1,
              'repeated_organizers': len(organizer_lines) - 1,
          }, ensure_ascii=False))
          PY
      - name: Commit summaries
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add series-candidate-titles.tsv series-candidate-organizers.tsv
          git commit -m 'chore: summarize unmatched series candidates [skip ci]'
          git pull --rebase origin agent/expand-series-links-2
          git push origin HEAD:agent/expand-series-links-2
