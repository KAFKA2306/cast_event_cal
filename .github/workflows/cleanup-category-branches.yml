name: Cleanup merged category ontology branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-category-branches.yml

permissions:
  contents: write

concurrency:
  group: cleanup-category-ontology-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete merged category branches
        run: |
          set -euo pipefail
          for branch in agent/refresh-category-ontology fix/category-production-gate; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
      - name: Remove one-time cleanup workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/cleanup-category-branches.yml
          git add -A
          git commit -m 'chore: remove completed category branch cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
