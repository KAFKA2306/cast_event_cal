name: Updater liveness

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'

permissions:
  actions: write # required only for bounded recovery workflow_dispatch
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read canonical updater control plane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          printf '{"runs":[],"jobs_by_run":{}}\n' > /tmp/liveness-input.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/update-calendar-v2.yml/runs?per_page=100" > /tmp/runs.json || exit 0
          python - <<'PY'
          import json, os, subprocess
          runs = json.load(open('/tmp/runs.json', encoding='utf-8')).get('workflow_runs', [])
          jobs = {}
          if runs:
              rid = str(runs[0]['id'])
              try:
                  raw = subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{rid}/jobs?per_page=100"], text=True)
                  jobs[rid] = json.loads(raw).get('jobs', [])
              except subprocess.CalledProcessError:
                  runs = []
          json.dump({'runs': runs, 'jobs_by_run': jobs}, open('/tmp/liveness-input.json', 'w', encoding='utf-8'))
          PY
      - name: Audit updater liveness
        if: always()
        run: python scripts/audit_updater_liveness.py --input /tmp/liveness-input.json --output updater-liveness.json
      - name: Plan bounded recovery after a late scheduled update
        if: ${{ always() && github.event_name == 'schedule' }}
        id: recovery
        run: >-
          python scripts/plan_stale_updater_recovery.py
          --audit updater-liveness.json
          --input /tmp/liveness-input.json
          --output updater-recovery-decision.json
          --github-output "$GITHUB_OUTPUT"
      - name: Dispatch one recovery update
        if: ${{ always() && github.event_name == 'schedule' && steps.recovery.outputs.dispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-calendar-v2.yml --ref main -f recovery_attempt=1
      - name: Upload machine-readable audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: updater-liveness
          path: |
            updater-liveness.json
            updater-recovery-decision.json
          if-no-files-found: error
