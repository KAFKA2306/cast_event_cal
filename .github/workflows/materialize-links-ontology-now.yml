name: Materialize links and ontology now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-links-ontology-now.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_official_asset_enrichment.py tests/test_event_link_discovery.py
      - name: Discover direct and already-expanded links
        env:
          EVENT_LINK_SKIP_SHORTENER_RESOLUTION: '1'
        run: python scripts/discover_event_links.py
      - run: python scripts/render_frontend.py
      - name: Validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          events=json.loads(Path('public/events.json').read_text())
          links=json.loads(Path('public/event-link-audit.json').read_text())
          ontology=json.loads(Path('public/event-ontology.json').read_text())
          html=Path('public/index.html').read_text()
          assert ontology['schema_version']=='2.0'
          assert ontology['source_event_count']==events['count']
          assert ontology['observed_entity_count']>2
          assert links['events_with_primary_action']>0
          assert links['shortener_resolution_skipped'] is True
          assert any(e.get('image_url') and e.get('primary_action_url') for e in events['events'])
          assert 'event-media-link' in html
          PY
      - name: Commit and clean up
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/events.json public/event-link-audit.json public/event-ontology.json public/ontology-match-audit.json public/health.json public/index.html
          git commit -m 'chore: materialize linked images and live ontology [skip ci]'
          rm .github/workflows/materialize-links-ontology-now.yml
          git add .github/workflows/materialize-links-ontology-now.yml
          git commit -m 'chore: remove completed link materializer [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
