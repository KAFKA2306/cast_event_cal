name: Verify Cloudflare Pages UIUX live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-pages-uiux-live.yml

permissions:
  contents: write

concurrency:
  group: verify-pages-uiux-live
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify live root and assets
        run: |
          set -euo pipefail
          base='https://vrc-cast-event-calender.pages.dev'
          verified=false
          for attempt in $(seq 1 48); do
            token="${GITHUB_RUN_ID}-${attempt}"
            if curl -fsS -D /tmp/root.headers "$base/?verify=$token" -o /tmp/root.html \
              && curl -fsS "$base/uiux-v4.css?verify=$token" -o /tmp/uiux.css \
              && curl -fsS "$base/uiux-v4.js?verify=$token" -o /tmp/uiux.js \
              && curl -fsS "$base/events.json?verify=$token" -o /tmp/events.json \
              && python - <<'PY'
          import json
          from pathlib import Path

          headers = Path('/tmp/root.headers').read_text(encoding='utf-8', errors='replace').lower()
          html = Path('/tmp/root.html').read_text(encoding='utf-8')
          css = Path('/tmp/uiux.css').read_text(encoding='utf-8')
          script = Path('/tmp/uiux.js').read_text(encoding='utf-8')
          events = json.loads(Path('/tmp/events.json').read_text(encoding='utf-8'))

          assert 'x-quality-view: 2026-08-03-quality-view-v4' in headers
          assert 'href="/uiux-v4.css"' in html
          assert 'src="/uiux-v4.js"' in html
          assert '.ux-mobile-nav' in css
          assert 'prefers-reduced-motion' in css
          assert '2026-08-03-quality-view-v4' in script
          assert 'MutationObserver' in script
          assert events['count'] == len(events['events'])
          assert events['count'] > 555
          PY
            then
              verified=true
              break
            fi
            sleep 10
          done
          test "$verified" = true
      - name: Write verification evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          def sha256(path: str) -> str:
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          events = json.loads(Path('/tmp/events.json').read_text(encoding='utf-8'))
          payload = {
              'schema_version': '1.0',
              'verified_at': datetime.now(UTC).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'page_url': 'https://vrc-cast-event-calender.pages.dev/',
              'quality_view': '2026-08-03-quality-view-v4',
              'root_header_verified': True,
              'root_asset_injection_verified': True,
              'css_contract_verified': True,
              'javascript_contract_verified': True,
              'event_count': events['count'],
              'sha256': {
                  'root_html': sha256('/tmp/root.html'),
                  'uiux_css': sha256('/tmp/uiux.css'),
                  'uiux_js': sha256('/tmp/uiux.js'),
                  'events_json': sha256('/tmp/events.json'),
              },
              'status': 'ok',
          }
          Path('audit/pages-uiux-verification.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Remove verification workflow and publish proof
        run: |
          set -euo pipefail
          branch='agent/pages-uiux-live-proof'
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/verify-pages-uiux-live.yml
          git add audit/pages-uiux-verification.json .github/workflows/verify-pages-uiux-live.yml
          git commit -m 'chore: record live UIUX verification [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
