name: Materialize refreshed category ontology

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-category-public.yml

permissions:
  contents: write

concurrency:
  group: materialize-category-public
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Verify category classifier
        run: pytest -q tests/test_category_ontology.py tests/test_frontend_link_view.py
      - name: Reclassify existing public events and render UI
        run: python scripts/render_frontend.py
      - name: Validate materialized category artifacts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          events=json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          categories=json.loads(Path('public/category-ontology.json').read_text(encoding='utf-8'))
          ontology=json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          audit=json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          health=json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          html=Path('public/index.html').read_text(encoding='utf-8')
          rows=events['events']
          allowed={item['id'] for item in categories['categories'] if item.get('id')}
          modes={'in_world','stream','hybrid','offline','deadline','unknown'}

          assert events['count'] == len(rows) and len(rows) > 555
          assert categories['schema_version'] == '2.0'
          assert all(row.get('category') in allowed for row in rows)
          assert all(row.get('event_mode') in modes for row in rows)
          assert all(isinstance(row.get('category_confidence'), (int,float)) for row in rows)
          assert not any(row.get('category') == 'event' for row in rows)
          assert ontology['schema_version'] == '3.0'
          assert ontology['source_event_count'] == len(rows)
          assert sum(ontology['category_breakdown'].values()) == len(rows)
          assert audit['schema_version'] == '2.0'
          assert audit['category_classification']['event_count'] == len(rows)
          assert health['category_classification']['event_count'] == len(rows)
          assert 'category-ontology.json' in html
          assert 'category_confidence' in html
          assert 'event-media-link' in html
          PY
      - name: Commit generated public artifacts and remove this workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              git fetch origin main
              git reset --hard origin/main
              python scripts/render_frontend.py
            fi
            rm -f .github/workflows/materialize-category-public.yml
            git add public .github/workflows/materialize-category-public.yml
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'chore: publish refreshed category ontology [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
