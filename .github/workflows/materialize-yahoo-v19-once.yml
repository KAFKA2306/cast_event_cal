# merge-trigger: 2026-08-03
name: Materialize Yahoo v1.9 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-yahoo-v19-once.yml

permissions:
  contents: write

concurrency:
  group: materialize-yahoo-v19-once
  cancel-in-progress: false

jobs:
  implement-test-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/yahoo-v19-recovery
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Materialize v1.9 integration
        run: |
          python scripts/apply_yahoo_v19_patch.py
          python scripts/fix_yahoo_v19_module.py
          rm -f .github/workflows/implement-yahoo-v19.yml
      - name: Static and regression tests
        run: |
          ruff check scripts/yahoo_classifier_v19.py scripts/evaluate_yahoo_v19_recovery.py scripts/audit_yahoo_recovery_patterns.py scripts/collect_yahoo_corpus.py scripts/refine_yahoo_corpus.py tests/test_yahoo_selection_policy.py
          pytest tests/test_yahoo_selection_policy.py tests/test_yahoo_best_1000.py tests/test_yahoo_query_ablation.py
      - name: Replay current ledger
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          python scripts/evaluate_yahoo_v19_recovery.py
          python scripts/refine_yahoo_corpus.py
      - name: Rebuild calendar and frontend
        run: |
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate recovery and assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          recovery = json.loads(Path('public/yahoo-v19-recovery-audit.json').read_text(encoding='utf-8'))
          classifier = json.loads(Path('public/yahoo-classifier-audit.json').read_text(encoding='utf-8'))
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          yahoo_events = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          sources = {row['name']: row for row in health['sources']}
          assert recovery['classifier_version'] == '1.9'
          assert recovery['candidate_count'] >= 2429
          assert recovery['accepted_count'] > recovery['baseline_accepted_count']
          assert recovery['recovered_from_target_reasons']['past_event_now'] > 0
          assert recovery['recovered_from_target_reasons']['missing_datetime'] > 0
          assert recovery['recovered_from_target_reasons']['missing_event_marker'] > 0
          assert recovery['remaining_target_reasons']['past_event_now'] == 0
          assert recovery['quality']['low_repost_accepted'] == 0
          assert recovery['quality']['recap_report_accepted'] == 0
          assert recovery['quality']['unstructured_giveaway_accepted'] == 0
          assert recovery['quality']['duplicate_status_ids'] == 0
          assert recovery['quality']['ambiguous_decisions'] == 0
          assert classifier['classifier_version'] == '1.9'
          assert classifier['candidate_count'] == history['candidate_count']
          assert classifier['accepted_count'] == len(yahoo_events)
          assert classifier['accepted_count'] + classifier['rejected_count'] == history['candidate_count']
          assert classifier['rejection_reason_counts'].get('past_event_now', 0) == 0
          assert all(int(row.get('max_retweet_count') or row.get('retweet_count') or 0) >= 3 for row in history['candidates'] if row.get('last_decision') == 'accepted')
          assert events['count'] == len(events['events'])
          assert health['event_count'] == events['count']
          assert sources['yahoo_realtime_events']['count'] == len(yahoo_events)
          PY
          grep -q 'VRChat Event Calendar' public/index.html
          grep -q 'BEGIN:VCALENDAR' public/calendar.ics
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-v19-recovery-evidence
          path: |
            public/yahoo-v19-recovery-audit.json
            public/yahoo-classifier-audit.json
            public/health.json
            data/yahoo_realtime_events.json
      - name: Commit implementation to feature branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement Yahoo classifier v1.9 recovery [skip ci]'
          git push origin HEAD:feat/yahoo-v19-recovery

  cleanup:
    needs: implement-test-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-yahoo-v19-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/materialize-yahoo-v19-once.yml
          git commit -m 'chore: remove completed Yahoo v1.9 materializer [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
