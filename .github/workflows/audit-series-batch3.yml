name: Audit event series batch 3

on:
  push:
    branches:
      - agent/expand-series-links-3
    paths:
      - .github/workflows/audit-series-batch3.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Extract exact candidate records
        run: |
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          targets = {
              'VRCでボーっとする会',
              'VRCふれあい動物園',
              'VR BLOOD RECALL 初心者説明会＆交流会',
              '居酒屋なぞとき',
              '謎めぐり',
          }
          payload = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          rows = payload['events']
          grouped = defaultdict(list)
          for row in rows:
              if row.get('title') in targets and not row.get('series_profile'):
                  grouped[row['title']].append(row)

          report = {}
          keys = [
              'id', 'title', 'organizer', 'description', 'start_at', 'end_at',
              'url', 'source_url', 'official_url', 'participation_url',
              'vrchat_group_url', 'source', 'category', 'subcategory', 'tags',
          ]
          for title in sorted(targets):
              items = grouped.get(title, [])
              report[title] = {
                  'count': len(items),
                  'distinct_organizers': sorted({str(item.get('organizer', '')).strip() for item in items if item.get('organizer')}),
                  'distinct_group_urls': sorted({str(item.get('vrchat_group_url', '')).strip() for item in items if item.get('vrchat_group_url')}),
                  'samples': [
                      {key: item[key] for key in keys if key in item and item[key] not in (None, '', [], {})}
                      for item in items[:3]
                  ],
              }
          Path('series-batch3-audit.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({title: data['count'] for title, data in report.items()}, ensure_ascii=False))
          PY
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add series-batch3-audit.json
          git commit -m 'chore: audit event series batch 3 [skip ci]'
          git pull --rebase origin agent/expand-series-links-3
          git push origin HEAD:agent/expand-series-links-3
