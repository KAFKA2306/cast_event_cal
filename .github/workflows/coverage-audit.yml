name: Coverage audit contract
on:
  pull_request:
    paths:
      - 'config/coverage_gold.json'
      - 'scripts/audit_coverage.py'
      - 'tests/test_audit_coverage.py'
      - '.github/workflows/coverage-audit.yml'
  workflow_dispatch:
jobs:
  coverage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 official immutable commit
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # official immutable commit
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run coverage contract tests
        run: python -m pytest -q tests/test_audit_coverage.py
      - name: Exercise one-command audit
        run: |
          printf '%s\n' '{"events":[],"supported_sources":["yahoo_realtime"],"source_unavailable":["yahoo_realtime"]}' > /tmp/coverage-run.json
          python scripts/audit_coverage.py --run /tmp/coverage-run.json --output /tmp/coverage-report.json
          python -m json.tool /tmp/coverage-report.json >/dev/null
