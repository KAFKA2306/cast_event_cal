name: Cleanup merged external source branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-external-source-branch.yml

permissions:
  contents: write

concurrency:
  group: cleanup-external-source-branch
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Delete merged source branch
        run: |
          set -euo pipefail
          branch='agent/external-event-source-routes'
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
      - name: Remove one-time cleanup workflow
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/cleanup-external-source-branch.yml
          git add -A
          git commit -m 'chore: remove completed external source branch cleanup [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
