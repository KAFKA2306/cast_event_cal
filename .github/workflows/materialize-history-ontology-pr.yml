name: Materialize Yahoo history and ontology PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/materialize-history-ontology-pr.yml

permissions:
  contents: write

concurrency:
  group: materialize-history-ontology-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay ledger and build public assets
        env:
          YAHOO_MIN_RETWEETS: '3'
        run: |
          set -euo pipefail
          python scripts/materialize_events.py
          python scripts/replay_yahoo_history.py
          python main_executor.py run --strict
          python scripts/render_frontend.py
      - name: Validate generated evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          history = json.loads(Path('public/yahoo-candidate-history.json').read_text(encoding='utf-8'))
          yahoo = json.loads(Path('data/yahoo_realtime_events.json').read_text(encoding='utf-8'))
          yahoo_health = json.loads(Path('data/yahoo_realtime_health.json').read_text(encoding='utf-8'))
          ontology = json.loads(Path('public/event-ontology.json').read_text(encoding='utf-8'))
          audit = json.loads(Path('public/ontology-match-audit.json').read_text(encoding='utf-8'))
          events = json.loads(Path('public/events.json').read_text(encoding='utf-8'))
          public_health = json.loads(Path('public/health.json').read_text(encoding='utf-8'))
          assert history['candidate_count'] >= 2
          assert history['retention_days'] == 30
          assert yahoo_health['parser_version'] == '1.4'
          assert yahoo_health['history_replay_mode'] == 'ledger_only'
          assert yahoo_health['history_candidate_count'] == history['candidate_count']
          assert len(yahoo) >= 2
          assert ontology['schema_version'] == '1.1'
          assert audit['matched_events'] >= 2
          assert audit['ambiguous_events'] == 0
          assert public_health['ontology']['matched_events'] == audit['matched_events']
          assert sum(1 for item in events['events'] if item.get('official_links')) >= 2
          PY
      - name: Commit generated outputs to PR branch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manual_events.json data/yahoo_realtime_events.json data/yahoo_realtime_rejected.json data/yahoo_realtime_health.json public
          git rm .github/workflows/materialize-history-ontology-pr.yml
          git commit -m 'chore: materialize Yahoo history and ontology'
          git push origin "HEAD:$HEAD_BRANCH"
