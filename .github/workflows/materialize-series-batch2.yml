name: Materialize verified event series batch 2

on:
  push:
    branches:
      - agent/expand-series-links-2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Materialize verified entries
        run: python scripts/materialize_series_batch2.py
      - name: Run focused regression tests
        run: pytest -q tests/test_event_series_ontology.py
      - name: Regenerate public ontology data
        run: |
          python -m cast_event_cal.ontology
          PYTHONPATH=. python scripts/build_observed_ontology.py
      - name: Validate exact outcome
        run: python scripts/materialize_series_batch2.py --validate
      - name: Remove audit and implementation artifacts
        run: |
          rm -f series-candidate-audit.json
          rm -f series-candidate-titles.tsv
          rm -f series-candidate-organizers.tsv
          rm -f .github/workflows/expand-series-candidate-audit.yml
          rm -f .github/workflows/materialize-series-batch2.yml
          rm -f scripts/materialize_series_batch2.py
      - name: Commit verified batch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Expand verified event series linking batch 2'
          git pull --rebase origin agent/expand-series-links-2
          git push origin HEAD:agent/expand-series-links-2
