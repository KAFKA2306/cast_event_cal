[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-event-cal"
version = "2.0.0"
description = "Source-traceable VRChat event calendar automation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "KAFKA2306" }]
dependencies = [
  "httpx>=0.28,<1",
  "Pillow>=11,<13",
  "PyYAML>=6.0.2,<7",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mcp>=2,<3"]
mcp = ["mcp>=2,<3"]

[project.scripts]
cast-event-cal = "cast_event_cal.core:main"
cast-event-cal-mcp = "cast_event_cal.mcp_server:main"

[tool.setuptools.packages.find]
include = ["cast_event_cal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "I001", "UP035", "UP037"]